# mkad-Konfiguration für die Container-Gegenstelle (tools/acfcan-viewer, #260).
# Identisch zu mkad-board.conf bis auf device/protected_device-Namen (hier
# egal, da beide Seiten denselben Interface-Namen "eth0"/"macsec0" nutzen
# können, solange sie auf unterschiedlichen physischen Hosts laufen) —
# entscheidend ist, dass cak/ckn exakt übereinstimmen.

log_level: info
verbosity: 1
hello_time: 2000
life_time: 6000
sak_retire_time: 3000
transmit_empty_dist_sak: on
transmit_empty_sak_use: on
transmit_null_xpn: on
secy_polling_ms: 500

interfaces:
  - device: "eth0"
    protected_device: "macsec0"
    intf_mode: STATIC
    macsec: CONF_0
    kay: on
    role: AUTO
    priority: 128
    replay_protect: 0
    delay_protect: on
    unauth_allowed: never
    unsecure_allowed: never
    ciphers: GCM_AES_128
    cak: 50 7C C3 BE C3 DA 4C C7 4B 7F 10 12 11 DF 74 6C
    ckn: 12 34
    drv_macsec_mode: software
