<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ACF-CAN Viewer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0}
  header{background:#1e293b;padding:1rem 2rem;border-bottom:2px solid #3b82f6;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:1.4rem;color:#3b82f6}
  .status{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
  .dot{width:10px;height:10px;border-radius:50%;background:#64748b}
  .dot.live{background:#22c55e;box-shadow:0 0 8px #22c55e}
  .wrap{padding:1.5rem}
  table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}
  th,td{padding:.6rem 1rem;text-align:left;font-size:.9rem}
  th{background:#334155;color:#94a3b8;font-weight:600;text-transform:uppercase;font-size:.75rem}
  tr:nth-child(even){background:#182236}
  td.id{color:#3b82f6;font-weight:700;font-family:monospace}
  td.data{font-family:monospace;color:#e2e8f0}
  td.ts{color:#64748b;font-size:.8rem}
  .empty{color:#64748b;text-align:center;padding:2rem}
  .counter{color:#94a3b8;font-size:.85rem;margin-bottom:.75rem}
</style>
</head>
<body>
<header>
  <h1>🚗 ACF-CAN Viewer — Open1722 ETH-Node</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text">Verbinde...</span></div>
</header>
<div class="wrap">
  <div class="counter" id="counter">0 Frames empfangen</div>
  <table>
    <thead><tr><th>Zeit</th><th>CAN-ID</th><th>DLC</th><th>Daten</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4" class="empty">Warte auf ACF-CAN-Frames …</td></tr></tbody>
  </table>
</div>
<script>
const MAX_ROWS = 50;
let count = 0;
const rows = document.getElementById('rows');
const dot = document.getElementById('dot');
const statusText = document.getElementById('status-text');
const counter = document.getElementById('counter');

function addRow(frame) {
  if (count === 0) rows.innerHTML = '';
  count++;
  counter.textContent = count + ' Frames empfangen';
  const tr = document.createElement('tr');
  const t = new Date(frame.timestamp).toLocaleTimeString('de-DE');
  tr.innerHTML = `<td class="ts">${t}</td><td class="id">${frame.can_id}</td><td>${frame.dlc}</td><td class="data">${frame.data}</td>`;
  rows.prepend(tr);
  while (rows.children.length > MAX_ROWS) rows.removeChild(rows.lastChild);
}

const source = new EventSource('/stream');
source.onopen = () => { dot.className = 'dot live'; statusText.textContent = 'Live'; };
source.onerror = () => { dot.className = 'dot'; statusText.textContent = 'Getrennt — reconnect …'; };
source.onmessage = (e) => addRow(JSON.parse(e.data));
</script>
</body>
</html>
