---
# ════════════════════════════════════════
# PIPELINE 1 — C & Rust Libraries
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 1-libraries

trigger:
  event: [push, pull_request,custom]
  branch: [main,develop]
  paths:
    - project/c-lib/**
    - project/rust-lib/**
    - .drone.yml

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: build-libraries
    image: ghcr.io/paulefl/generic-builder:latest
    commands:
      - SRC=/drone/src OUTPUT=/drone/src/bin bash /drone/src/scripts/build-arm.sh

  - name: test-c-lib
    image: debian:bookworm
    depends_on: [build-libraries]
    commands:
      - apt-get update -q && apt-get install -y -q gcc make
      - make -C c-lib test

  - name: test-rust-lib
    image: rust:alpine
    depends_on: [build-libraries]
    commands:
      - apk add --no-cache musl-dev
      - cargo test --manifest-path project/rust-lib/Cargo.toml

  - name: test-go
    image: golang:1.24
    depends_on: [build-libraries]
    environment:
      COVERPKG: ./pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/
      TEST_PACKAGES: ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/
    commands:
      - cd project/go-api
      - go install gotest.tools/gotestsum@v1.12.0
      - go install github.com/boumenot/gocover-cobertura@latest
      - mkdir -p ../../reports
      - >-
        gotestsum
        --junitfile ../../reports/go-tests-junit.xml
        --jsonfile  ../../reports/go-tests.json
        --
        -race -count=3
        -coverprofile=coverage.out
        -covermode=atomic
        -coverpkg=$COVERPKG
        $TEST_PACKAGES
      - |
        total=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
        echo "Coverage: ${total}%"
        awk "BEGIN{exit !($total >= 75)}" || (echo "❌ Coverage gate: ${total}% < 75%" && exit 1)
        echo "✅ Coverage gate: ${total}% >= 75%"
  - name: junit-reports-pipe1-go_tests
    image: ghcr.io/rohit-gohri/drone-junit:v0
    depends_on: [test-go]
    settings:
      paths: reports/go-tests-junit.xml
      report_name: "junit-reports - Pipe 1 - go-tests-junit"
    when:
      status: [
        'success',
        'failure',
      ]

---
# ════════════════════════════════════════
# PIPELINE 2 — Embedded SW (Go API + HAL)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 2-embedded-sw

trigger:
  event: [push, pull_request,custom]
  branch: [main,develop]
  paths:
    - project/go-api/**
    - c-lib/**
    - project/rust-lib/**
    - .drone.yml

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: test-hal-unit
    image: golang:1.24
    commands:
      - cd project/go-api && go test ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ -v -count=1

  - name: lint-go
    image: golang:1.24
    depends_on: []
    commands:
      - make lint

  - name: build-go-api
    image: ghcr.io/paulefl/generic-builder:latest
    depends_on: [test-hal-unit]
    commands:
      - SRC=/drone/src OUTPUT=/drone/src/bin bash /drone/src/scripts/build-arm.sh

  - name: deploy-beaglebone
    image: alpine
    depends_on: [build-go-api]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      BEAGLE_USER: {from_secret: beagle_user}
      BEAGLE_KEY:  {from_secret: beagle_ssh_key}
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$BEAGLE_KEY" | base64 -d > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -H $BEAGLE_HOST >> ~/.ssh/known_hosts
      - scp bin/embedded project/go-api/libs/libhardware.so project/go-api/libs/libhardware_rs.so bin/bbcli-linux-arm $BEAGLE_USER@$BEAGLE_HOST:/app/
      - |
        ssh $BEAGLE_USER@$BEAGLE_HOST \
            "cp /app/bbcli-linux-arm /app/bbcli && \
             systemctl restart embedded-sw && \
             sleep 3 && \
             systemctl is-active embedded-sw"
    when:
      branch: [main,develop]
      event:  [push]

  - name: test-hardware-c
    image: python:3.12-alpine
    depends_on: [deploy-beaglebone]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      HW_BACKEND: c
    commands:
      - pip install pytest requests --break-system-packages -q
      - pytest tests/hardware/ -v --timeout=60
    when:
      branch: [main,develop]
      event:  [push]

  - name: test-hardware-rust
    image: python:3.12-alpine
    depends_on: [deploy-beaglebone]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      HW_BACKEND: rust
    commands:
      - pip install pytest requests --break-system-packages -q
      - pytest tests/hardware/ -v --timeout=60
    when:
      branch: [main,develop]
      event:  [push]

  - name: test-hardware-auto
    image: python:3.12-alpine
    depends_on: [test-hardware-c, test-hardware-rust]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
    commands:
      - pip install pytest requests --break-system-packages -q
      - pytest tests/hardware/ -v --timeout=60
    when:
      branch: [main,develop]
      event:  [push]

---
# ════════════════════════════════════════
# PIPELINE 3 — Tools (CLI + TUI + GUI) 
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 3-tools

trigger:
  event: [push, pull_request,custom]
  branch: [main,develop]
  paths:
    - tools/**
    - .drone.yml

steps:
  - name: lint-cli
    image: golang:1.24
    commands:
      - cd tools/cli && go mod tidy && go vet ./...
      - |
        test -z "$(gofmt -l tools/cli/)" || (echo "gofmt: tools/cli/" && exit 1)

  - name: lint-tui
    image: golang:1.24
    depends_on: []
    commands:
      - cd tools/tui && go mod tidy && go vet ./...

  - name: build-cli-linux-amd64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-linux-amd64 .

  - name: build-cli-linux-arm
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-linux-arm .

  - name: build-cli-darwin-amd64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-amd64 .

  - name: build-cli-darwin-arm64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: darwin
      GOARCH: arm64
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-arm64 .

  - name: build-cli-windows-amd64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-windows-amd64.exe .

  - name: build-tui-linux-amd64
    image: golang:1.24
    depends_on: [lint-tui]
    environment:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/tui && go build -ldflags="-s -w" -o ../../bin/bbtui-linux-amd64 .

  - name: build-tui-linux-armv7
    image: golang:1.24
    depends_on: [lint-tui]
    environment:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
      CGO_ENABLED: "0"
    commands:
      - cd tools/tui && go build -ldflags="-s -w" -o ../../bin/bbtui-linux-armv7 .

  - name: build-tui-darwin-amd64
    image: golang:1.24
    depends_on: [lint-tui]
    environment:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/tui && go build -ldflags="-s -w" -o ../../bin/bbtui-darwin-amd64 .

  - name: validate-web-gui
    image: python:3.12-alpine
    depends_on: []
    commands:
      - |
        python -c "
        from html.parser import HTMLParser
        class V(HTMLParser): pass
        V().feed(open('tools/web-gui/index.html').read())
        print('HTML valide')
        "

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    depends_on: []
    commands:
      - shellcheck --severity=error scripts/*.sh

  - name: checksums
    image: alpine
    depends_on:
      - build-cli-linux-amd64
      - build-cli-linux-arm
      - build-cli-darwin-amd64
      - build-cli-darwin-arm64
      - build-cli-windows-amd64
      - build-tui-linux-amd64
      - build-tui-linux-armv7
      - build-tui-darwin-amd64
    commands:
      - cd bin && sha256sum bbcli-* bbtui-* > checksums.sha256 && cat checksums.sha256

---
# ════════════════════════════════════════
# PIPELINE 4 — WebApp Frontend
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 4-webapp

trigger:
  event: [push, pull_request,custom]
  branch: [main,develop]
  paths:
    - tools/web-gui/**
    - .drone.yml

steps:
  - name: validate-html
    image: python:3.12-alpine
    commands:
      - |
        python -c "
        from html.parser import HTMLParser
        class V(HTMLParser): pass
        V().feed(open('tools/web-gui/index.html').read())
        print('HTML valide')
        "

  - name: package-web-gui
    image: alpine
    depends_on: [validate-html]
    commands:
      - apk add --no-cache zip
      - mkdir -p bin/web-gui
      - cp tools/web-gui/index.html bin/web-gui/
      - |
        echo "${DRONE_TAG:-dev}" > bin/web-gui/version.txt
      - cd bin && zip -r bbweb-gui.zip web-gui/

---
# ════════════════════════════════════════
# PIPELINE 5 — Release (nur bei Tags)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 5-release

trigger:
  event: [tag]
  ref:
    exclude: [refs/tags/*-toTestOnTarget, refs/tags/*-stable]

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: build-arm
    image: ghcr.io/paulefl/generic-builder:latest
    commands:
      - SRC=/drone/src OUTPUT=/drone/src/bin bash /drone/src/scripts/build-arm.sh

  - name: build-cli
    image: golang:1.24
    depends_on: []
    commands:
      - cd tools/cli
      - GOOS=linux  GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-linux-amd64 .
      - GOOS=linux  GOARCH=arm GOARM=7  CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-linux-arm .
      - GOOS=darwin GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-amd64 .
      - GOOS=darwin GOARCH=arm64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-arm64 .
      - GOOS=windows GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-windows-amd64.exe .

  - name: build-tui
    image: golang:1.24
    depends_on: []
    commands:
      - cd tools/tui
      - GOOS=linux  GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-linux-amd64 .
      - GOOS=linux  GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-linux-armv7 .
      - GOOS=darwin GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-darwin-amd64 .

  - name: build-web-gui
    image: alpine
    depends_on: []
    commands:
      - apk add --no-cache zip
      - mkdir -p bin/web-gui
      - cp tools/web-gui/index.html bin/web-gui/
      - echo "$DRONE_TAG" > bin/web-gui/version.txt
      - cd bin && zip -r bbweb-gui.zip web-gui/

  - name: checksums
    image: alpine
    depends_on: [build-arm, build-cli, build-tui, build-web-gui]
    commands:
      - cd bin && sha256sum embedded bbcli-* bbtui-* bbweb-gui.zip > checksums.sha256 && cat checksums.sha256

  - name: build-docker-image
    image: quay.io/podman/stable
    privileged: true
    depends_on: [build-arm]
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: registry_token}
    commands:
      - echo "$REGISTRY_TOKEN" | podman login -u $REGISTRY_USER --password-stdin docker.io
      - podman build --platform linux/arm/v7 -f project/go-api/Dockerfile.embedded -t myuser/embedded-sw:$DRONE_TAG -t myuser/embedded-sw:latest .
      - podman push myuser/embedded-sw:$DRONE_TAG
      - podman push myuser/embedded-sw:latest

  - name: create-release
    image: plugins/github-release
    depends_on: [build-docker-image]
    settings:
      api_key: {from_secret: github_token}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbcli-darwin-amd64
        - bin/bbcli-darwin-arm64
        - bin/bbcli-windows-amd64.exe
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/bbtui-darwin-amd64
        - bin/bbweb-gui.zip
        - bin/checksums.sha256
      checksum: [sha256]
      title: "Release $DRONE_TAG"

  - name: create-toTestOnTarget-release
    image: plugins/github-release
    depends_on: [create-release]
    settings:
      api_key: {from_secret: github_token}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/checksums.sha256
      checksum: [sha256]
      title: "$DRONE_TAG-toTestOnTarget"
      tag: "$DRONE_TAG-toTestOnTarget"
      prerelease: true

---
# ════════════════════════════════════════
# PIPELINE 6 — Nightly (täglich 02:00)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 6-nightly

trigger:
  event: [cron]
  cron: [nightly]

steps:
  - name: test-all-backends
    image: python:3.12-alpine
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
    commands:
      - pip install pytest requests --break-system-packages -q
      - for backend in c rust auto; do echo "=== Backend $backend ==="; HW_BACKEND=$backend pytest tests/hardware/ -v --timeout=60 || exit 1; done

  - name: notify-slack
    image: plugins/slack
    depends_on: [test-all-backends]
    settings:
      webhook: {from_secret: slack_webhook}
      channel: builds
      template: "Nightly Build {{build.number}} — {{build.status}} {{build.link}}"
    when:
      status: [success, failure]

---
kind: pipeline
type: docker
name: 7-reports

trigger:
  event: [push, pull_request,custom]
  branch: [main,develop]

steps:
  - name: go-tests-with-coverage
    image: golang:1.24
    commands:
      - mkdir -p reports
      - cd project/go-api
      - go install gotest.tools/gotestsum@v1.12.0
      - |
        gotestsum \
          --junitfile ../../reports/go-tests-junit.xml \
          --jsonfile  ../../reports/go_tests.json \
          -- \
          -count=1 \
          -coverprofile=../../reports/go_coverage.out \
          -covermode=atomic \
          -coverpkg=./pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/ \
          ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ || true
      - go tool cover -func=../../reports/go_coverage.out || true

  - name: junit-reports-pipe-7
    image: ghcr.io/rohit-gohri/drone-junit:v0
    depends_on: [go-tests-with-coverage]
    settings:
      paths: reports/go-tests-junit.xml
      report_name: "junit-reports - Pipe 7 - go-tests-with-coverage"
    when:
      status: [success, failure]

  - name: python-tests
    image: python:3.12-alpine
    depends_on: []
    commands:
      - mkdir -p reports
      - pip install -r tests/requirements-dev.txt pytest-json-report --break-system-packages -q
      - pytest tests/ --ignore=tests/hardware/ -v --json-report --json-report-file=reports/python_tests.json --timeout=30 || true

  - name: python-security
    image: python:3.12-alpine
    depends_on: []
    commands:
      - mkdir -p reports
      - pip install bandit bandit-sarif-formatter --break-system-packages -q
      - bandit -r scripts/ tests/ project/ -f sarif -o reports/python-sarif.json --exclude tests/hardware/ || true
      - echo "Bandit done"

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    depends_on: []
    commands:
      - mkdir -p reports
      - shellcheck scripts/*.sh 2>&1 | tee reports/shellcheck.txt || true

  - name: c-coverage
    image: debian:bookworm
    depends_on: []
    commands:
      - mkdir -p reports
      - apt-get update -q && apt-get install -y -q gcc make lcov
      - make -C c-lib CFLAGS="-fprofile-arcs -ftest-coverage -g" CC=gcc test || true
      - bash scripts/c_coverage.sh c-lib/ reports/c-coverage.info '/usr/*' '*/test/*' || true

  - name: adoc-build
    image: asciidoctor/docker-asciidoctor:latest
    depends_on: []
    commands:
      - gem install asciidoctor-pdf rouge --quiet || true
      - ROOT_DIR=. OUTPUT_DIR=reports/docs bash scripts/build_adoc.sh || true
      - find reports/docs -name "*.html" -o -name "*.pdf" | sort || true
      
  #ghcr.io/paulefl/strictdoc:latest
  - name: strictdoc-export
    image: python:3.11
    depends_on: [go-tests-with-coverage]
    commands:
      - pip install strictdoc
      - mkdir -p reports/strictdoc
      - strictdoc export . --formats html --output-dir reports/strictdoc || true
      - find reports/strictdoc -name "*.html" | head -10 || true
      - zip -r strictdoc-output.zip build/

  - name: prepare
    image: alpine
    commands:
      - SHA8=$(echo "$DRONE_COMMIT_SHA" | head -c8)
      - FILE=strictdoc-$SHA8.zip
      - mv strictdoc-output.zip $FILE
      - echo $FILE > artifact_name.txt

  - name: upload
    image: appleboy/drone-scp
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: strictdoc-*.zip
      target: /var/www/downloads/

  - name: print-url
    image: alpine
    commands:
      - SHA8=$(echo "$DRONE_COMMIT_SHA" | head -c8)
      - echo "Download URL:"
      - echo "http://192.168.2.55/downloads/strictdoc-$SHA8.zip"

  - name: strictdoc-coverage-gate
    image: python:3.12-slim
    depends_on: [strictdoc-export]
    commands:
      - |
        python3 scripts/check_req_coverage.py \
          --sdoc-dir docs/requirements \
          --junit-xml reports/go-tests-junit.xml \
          --output-junit reports/req-coverage-junit.xml \
          --min-coverage 70 || true
  - name: junit-reports-req-coverage
    image: ghcr.io/rohit-gohri/drone-junit:v0
    depends_on: [strictdoc-coverage-gate]
    settings:
      paths: reports/reports/req-coverage-junit.xml
      report_name: "junit-reports - Req coverage"
    when:
      status: [
        'success',
        'failure',
      ]
  - name: sonarqube-report
    image: python:3.12-alpine
    depends_on: [go-tests-with-coverage, c-coverage, python-security]
    commands:
      - pip install requests defusedxml --break-system-packages -q
      - |
        SONAR_TOKEN=$(cat /run/secrets/sonar_token 2>/dev/null || echo "")
        if [ -z "$SONAR_TOKEN" ]; then echo "SONAR_TOKEN nicht gesetzt — übersprungen"; exit 0; fi
        python3 .github/actions/sonarqube-report/sonarqube_report.py --token "$SONAR_TOKEN" --project paulefl_beaglebone_black --output reports/sonar-report.html || true

  - name: sonarcloud-scan
    image: sonarsource/sonar-scanner-cli:latest
    depends_on: [go-tests-with-coverage, c-coverage, python-security]
    commands:
      - |
        sonar-scanner \
            -Dsonar.projectKey=paulefl_beaglebone_black \
            -Dsonar.organization=paulefl \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.go.coverage.reportPaths=reports/go_coverage.out \
            -Dsonar.c.lcov.reportPaths=reports/c-coverage.info \
            || true
    when:
      branch: [main,develop]
      event: [push]

  - name: collect-and-report
    image: python:3.12-slim
    depends_on:
      - go-tests-with-coverage
      - python-tests
      - c-coverage
      - adoc-build
    commands:
      - pip install reportlab jinja2 --quiet
      - python3 scripts/collect_results.py --workspace reports --output reports/test_results.json || true
      - python3 scripts/generate_reports.py --output reports/summary --results reports/test_results.json --trend reports/test_trend.json || true
      - ls -lh reports/ || true

  - name: quality-gates
    image: python:3.12-alpine
    depends_on: [collect-and-report]
    commands:
      - python3 scripts/collect_results.py --check-gates --results reports/test_results.json --min-success-rate 90 --min-avg-coverage 75 --min-file-coverage 50 || true

  - name: package-artifacts
    image: alpine
    depends_on:
      - collect-and-report
      - adoc-build
      - strictdoc-coverage-gate
      - sonarqube-report
    commands:
      - apk add --no-cache zip
      - cd reports && zip -r ../reports-$DRONE_BUILD_NUMBER.zip . 2>/dev/null || true
      - echo "Artifacts gepackt"

  - name: notify
    image: plugins/slack
    depends_on: [quality-gates, package-artifacts]
    settings:
      webhook: {from_secret: slack_webhook}
      channel: builds
      template: "Build {{build.number}} — {{build.status}} {{build.link}}"
    when:
      status: [success, failure]
      branch: [main,develop]
      event:  [push, tag]

---
# ════════════════════════════════════════
# PIPELINE 8 — Bausteinsicht
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 8-bausteinsicht

trigger:
  event: [push, pull_request,custom]
  branch: [main,develop]
  paths:
    - arch/model/**
    - .drone.yml

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: validate-model
    image: ghcr.io/paulefl/bausteinsicht:latest
    commands:
      - bausteinsicht validate --model arch/model/beaglebone_black.jsonc

  - name: export-plantuml
    image: ghcr.io/paulefl/bausteinsicht:latest
    depends_on: [validate-model]
    commands:
      - mkdir -p arch/model/export/plantuml
      - bausteinsicht export-diagram --model arch/model/beaglebone_black.jsonc --diagram-format plantuml --output arch/model/export/plantuml

  - name: export-mermaid
    image: ghcr.io/paulefl/bausteinsicht:latest
    depends_on: [validate-model]
    commands:
      - mkdir -p arch/model/export/mermaid
      - bausteinsicht export-diagram --model arch/model/beaglebone_black.jsonc --diagram-format mermaid --output arch/model/export/mermaid

  - name: export-table
    image: ghcr.io/paulefl/bausteinsicht:latest
    depends_on: [validate-model]
    commands:
      - mkdir -p arch/model/export/table
      - bausteinsicht export-table --model arch/model/beaglebone_black.jsonc --table-format md --combined --output arch/model/export/table

  - name: export-png
    image: ghcr.io/paulefl/bausteinsicht:latest
    depends_on: [export-plantuml, export-mermaid, export-table]
    commands:
      - mkdir -p arch/model/export/png
      - dbus-daemon --system --fork 2>/dev/null || true
      - xvfb-run -a bausteinsicht export --model arch/model/beaglebone_black.jsonc --output arch/model/export/png

  - name: commit-exports
    image: alpine/git
    depends_on: [export-png]
    environment:
      GIT_TOKEN: {from_secret: git_token}
      GIT_USER:  {from_secret: git_user}
    commands:
      - git config user.name "drone-ci[bot]"
      - git config user.email "drone-ci[bot]@noreply"
      - git add arch/model/export/
      - |
        if git diff --staged --quiet; then
          echo "Keine Änderungen in arch/model/export"
        else
          git commit -m "ci(bausteinsicht): update exported diagrams [skip ci]"
          git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} HEAD:${DRONE_BRANCH}
        fi
    when:
      event: [push]
      branch: [main,develop]

---
# ════════════════════════════════════════
# PIPELINE 9 — Builder Image
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 9-build-container

trigger:
  event: [push, pull_request,custom]
  branch: [main,container_build]
  paths:
    - docker/builder/**
    - docker/bausteinsicht/**
    - docker/strictdoc/**
    - .drone.yml

steps:
  - name: build-generic-builder
    image: quay.io/podman/stable
    privileged: true
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: registry_token}
      REGISTRY_OWNER: {from_secret: registry_owner}
    commands:
      - |
        podman login ghcr.io -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"
        SHA8=$(echo "$DRONE_COMMIT_SHA" | head -c8)
        podman build -t generic-builder:latest -t generic-builder:$SHA8 -f docker/builder/Dockerfile docker/builder
        podman push generic-builder:latest ghcr.io/$REGISTRY_OWNER/generic-builder:latest
        podman push generic-builder:$SHA8 ghcr.io/$REGISTRY_OWNER/generic-builder:$SHA8
        echo "generic-builder gepushed mit SHA $SHA8"

  - name: clone-bausteinsicht-repo
    image: alpine/git
    depends_on: []
    environment:
      GIT_TOKEN: {from_secret: Bau_token}
    commands:
      - git clone --depth 1 https://oauth2:$GIT_TOKEN@github.com/docToolchain/Bausteinsicht.git /drone/src/docker/bausteinsicht/repo

  - name: build-bausteinsicht
    image: quay.io/podman/stable
    privileged: true
    depends_on: [clone-bausteinsicht-repo]
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: registry_token}
      REGISTRY_OWNER: {from_secret: registry_owner}
    commands:
      - |
        podman login ghcr.io -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"
        SHA8=$(echo "$DRONE_COMMIT_SHA" | head -c8)
        podman build -t bausteinsicht-base:latest \
          -f docker/bausteinsicht/repo/.devcontainer/Dockerfile \
          docker/bausteinsicht/repo
        podman build -t bausteinsicht:latest -t bausteinsicht:$SHA8 \
          --build-arg BASE_IMAGE=bausteinsicht-base:latest \
          -f docker/bausteinsicht/Dockerfile \
          docker/bausteinsicht
        podman push bausteinsicht:latest ghcr.io/$REGISTRY_OWNER/bausteinsicht:latest
        podman push bausteinsicht:$SHA8 ghcr.io/$REGISTRY_OWNER/bausteinsicht:$SHA8
        echo "bausteinsicht gepushed mit SHA $SHA8"

  - name: build-strictdoc
    image: quay.io/podman/stable
    privileged: true
    depends_on: []
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: registry_token}
      REGISTRY_OWNER: {from_secret: registry_owner}
    commands:
      - |
        podman login ghcr.io -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"
        SHA8=$(echo "$DRONE_COMMIT_SHA" | head -c8)
        podman build -t strictdoc:latest -t strictdoc:$SHA8 \
          -f docker/strictdoc/Dockerfile \
          docker/strictdoc
        podman push strictdoc:latest ghcr.io/$REGISTRY_OWNER/strictdoc:latest
        podman push strictdoc:$SHA8 ghcr.io/$REGISTRY_OWNER/strictdoc:$SHA8
        echo "strictdoc gepushed mit SHA $SHA8"

---
# ════════════════════════════════════════
# PIPELINE 10 — Integration Tests (on-target)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 10-integration-tests

trigger:
  event: [tag]
  ref:
    include: [refs/tags/*-toTestOnTarget]

steps:
  - name: download-release-assets
    image: alpine
    environment:
      GIT_TOKEN: {from_secret: git_token}
    commands:
      - apk add --no-cache curl jq
      - mkdir -p bin
      - TAG=$DRONE_TAG
      - |
        curl -sL -H "Authorization: token $GIT_TOKEN" \
          "https://api.github.com/repos/$DRONE_REPO/releases/tags/$TAG" \
          | jq -r '.assets[] | .browser_download_url' \
          | while read url; do
              NAME=$(basename "$url")
              curl -sL -H "Authorization: token $GIT_TOKEN" -o "bin/$NAME" "$url"
              echo "Downloaded: $NAME"
            done
      - ls -lh bin/

  - name: deploy-to-bbb
    image: alpine
    depends_on: [download-release-assets]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      BEAGLE_USER: {from_secret: beagle_user}
      BEAGLE_KEY:  {from_secret: beagle_ssh_key}
    commands:
      - apk add --no-cache openssh-client
      - KEY=$(mktemp) && trap "rm -f $KEY" EXIT
      - echo "$BEAGLE_KEY" | base64 -d > $KEY && chmod 600 $KEY
      - SSH="ssh -i $KEY -o StrictHostKeyChecking=no $BEAGLE_USER@$BEAGLE_HOST"
      - SCP="scp -i $KEY -o StrictHostKeyChecking=no"
      - $SSH "mkdir -p ~/bin && rm -f ~/bin/*.so ~/bin/embedded ~/bin/bbcli"
      - $SCP bin/embedded bin/libhardware.so bin/libhardware_rs.so bin/bbcli-linux-arm $BEAGLE_USER@$BEAGLE_HOST:~/bin/ 2>/dev/null || true
      - $SSH "cp ~/bin/bbcli-linux-arm ~/bin/bbcli && chmod +x ~/bin/*"
      - echo "Deploy abgeschlossen"

  - name: test-hardware
    image: python:3.12-alpine
    depends_on: [deploy-to-bbb]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
    commands:
      - pip install pytest requests pytest-json-report --break-system-packages -q
      - pytest tests/hardware/test_hardware.py -v --timeout=60 --json-report --json-report-file=reports/hardware-tests.json || true

  - name: test-api
    image: python:3.12-alpine
    depends_on: [deploy-to-bbb]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
    commands:
      - pip install pytest requests pytest-json-report --break-system-packages -q
      - pytest tests/api/test_api.py -v --timeout=30 --json-report --json-report-file=reports/api-tests.json || true

  - name: test-uart-on-bbb
    image: python:3.12-alpine
    depends_on: [deploy-to-bbb]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      BEAGLE_USER: {from_secret: beagle_user}
      BBCLI_REMOTE: /home/debian/bin/bbcli
    commands:
      - pip install pytest --break-system-packages -q
      - pytest tests/hardware/test_uart.py -v --timeout=30 --json-report --json-report-file=reports/uart-tests.json || true

  - name: test-cli-on-bbb
    image: alpine
    depends_on: [deploy-to-bbb]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      BEAGLE_USER: {from_secret: beagle_user}
      BEAGLE_KEY:  {from_secret: beagle_ssh_key}
    commands:
      - apk add --no-cache openssh-client
      - KEY=$(mktemp) && trap "rm -f $KEY" EXIT
      - echo "$BEAGLE_KEY" | base64 -d > $KEY && chmod 600 $KEY
      - SSH="ssh -i $KEY -o StrictHostKeyChecking=no $BEAGLE_USER@$BEAGLE_HOST"
      - $SSH "~/bin/bbcli --version"
      - $SSH "~/bin/bbcli system status"
      - $SSH "~/bin/bbcli bme280 read"
      - echo "CLI on-device Tests bestanden"

  - name: test-cli-remote
    image: python:3.12-alpine
    depends_on: [deploy-to-bbb]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      BBCLI: ./bin/bbcli-linux-amd64
    commands:
      - pip install pytest pytest-json-report --break-system-packages -q
      - chmod +x bin/bbcli-linux-amd64
      - pytest tests/cli/test_cli.py -v --timeout=30 --json-report --json-report-file=reports/cli-tests.json || true

  - name: promote-to-stable
    image: alpine
    depends_on:
      - test-hardware
      - test-api
      - test-uart-on-bbb
      - test-cli-on-bbb
      - test-cli-remote
    environment:
      GIT_TOKEN: {from_secret: git_token}
    commands:
      - apk add --no-cache curl jq git
      - |
        OLD_TAG=$DRONE_TAG
        VERSION=${OLD_TAG%-toTestOnTarget}
        NEW_TAG=$VERSION-stable
        echo "Promoting $OLD_TAG -> $NEW_TAG"
        curl -sf -X POST "https://api.github.com/repos/$DRONE_REPO/releases" \
          -H "Authorization: token $GIT_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"${NEW_TAG}\",\"name\":\"${VERSION}\",\"prerelease\":false}"
        echo "Promoted zu $NEW_TAG"

---
# ════════════════════════════════════════
# PIPELINE 11 — Version Bump & Release
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 11-version-bump

trigger:
  event: [promote]
  target: [release-patch, release-minor, release-major]

steps:
  - name: bump-version
    image: alpine/git
    environment:
      GIT_TOKEN: {from_secret: git_token}
      GIT_USER:  {from_secret: git_user}
    commands:
      - |
        BUMP=${DRONE_DEPLOY_TO##release-}
        CURRENT=$(grep '^VERSION' Makefile | awk '{print $3}')
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        case "$BUMP" in
          major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR+1)); PATCH=0 ;;
          patch) PATCH=$((PATCH+1)) ;;
        esac
        NEW="${MAJOR}.${MINOR}.${PATCH}"
        sed -i "s/^VERSION = .*/VERSION = $NEW/" Makefile
        git config user.name "drone-ci[bot]"
        git config user.email "drone-ci[bot]@noreply"
        git add Makefile CHANGELOG.md
        git commit -m "chore(release): bump version to ${NEW} [skip ci]"
        git tag "v${NEW}"
        git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} HEAD:main
        git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} "v${NEW}"

---
# ════════════════════════════════════════
# PIPELINE 12 — Changelog Update
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 12-changelog

trigger:
  event: [push, pull_request,custom]
  branch: [main,develop]

steps:
  - name: update-changelog
    image: alpine/git
    environment:
      GIT_TOKEN: {from_secret: git_token}
      GIT_USER:  {from_secret: git_user}
    commands:
      - apk add --no-cache curl tar
      - |
        curl -sSfL https://github.com/orhun/git-cliff/releases/latest/download/git-cliff-x86_64-unknown-linux-musl.tar.gz \
          | tar -xz --strip-components=1 -C /usr/local/bin git-cliff-x86_64-unknown-linux-musl/git-cliff
      - git-cliff --unreleased --output unreleased.md
      - make prepend-changelog
      - git config user.name "drone-ci[bot]"
      - git config user.email "drone-ci[bot]@noreply"
      - git add CHANGELOG.md
      - |
        if git diff --cached --quiet; then
          echo "Keine Changelog-Änderungen"
        else
          git commit -m "docs(changelog): update unreleased section [skip ci]"
          git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} HEAD:main
        fi
