# ════════════════════════════════════════
# PIPELINE 10 — Integration Tests (on-target)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 10-integration-tests

trigger:
  event: [tag]
  ref:
    include: [refs/tags/*-toTestOnTarget]

steps:
  - name: download-release-assets
    image: alpine
    environment:
      GIT_TOKEN: {from_secret: git_token}
    commands:
      - mkdir -p .step-status
      - apk add --no-cache curl jq
      - mkdir -p bin
      - TAG=$DRONE_TAG
      - |
        curl -sL -H "Authorization: token $GIT_TOKEN" \
          "https://api.github.com/repos/$DRONE_REPO/releases/tags/$TAG" \
          | jq -r '.assets[] | .browser_download_url' \
          | while read url; do
              NAME=$(basename "$url")
              curl -sL -H "Authorization: token $GIT_TOKEN" -o "bin/$NAME" "$url"
              echo "Downloaded: $NAME"
            done
      - ls -lh bin/
      - echo pass > .step-status/download-release-assets

  - name: deploy-to-bbb
    image: appleboy/drone-scp
    depends_on: [download-release-assets]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      source:
        - bin/embedded
        - bin/libhardware.so
        - bin/libhardware_rs.so
        - bin/bbcli-linux-arm
      target: /home/debian/bin/

  - name: restart-bbb-service
    image: appleboy/drone-ssh
    depends_on: [deploy-to-bbb]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      script:
        - cp ~/bin/bbcli-linux-arm ~/bin/bbcli
        - chmod +x ~/bin/*
        - echo "Deploy abgeschlossen"

  - name: test-hardware
    image: python:3.12-alpine
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
    commands:
      - mkdir -p .step-status
      - pip install pytest requests pytest-json-report --break-system-packages -q
      - pytest tests/hardware/test_hardware.py -v --timeout=60 --json-report --json-report-file=reports/hardware-tests.json || true
      - echo pass > .step-status/test-hardware

  - name: test-api
    image: python:3.12-alpine
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
    commands:
      - mkdir -p .step-status
      - pip install pytest requests pytest-json-report --break-system-packages -q
      - pytest tests/api/test_api.py -v --timeout=30 --json-report --json-report-file=reports/api-tests.json || true
      - echo pass > .step-status/test-api

  - name: test-uart-on-bbb
    image: python:3.12-alpine
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      BEAGLE_USER:
        from_secret: beagle_user
      BBCLI_REMOTE: /home/debian/bin/bbcli
    commands:
      - mkdir -p .step-status
      - pip install pytest --break-system-packages -q
      - pytest tests/hardware/test_uart.py -v --timeout=30 --json-report --json-report-file=reports/uart-tests.json || true
      - echo pass > .step-status/test-uart-on-bbb

  - name: test-cli-on-bbb
    image: appleboy/drone-ssh
    depends_on: [restart-bbb-service]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      script:
        - ~/bin/bbcli --version
        - ~/bin/bbcli system status
        - ~/bin/bbcli bme280 read
        - echo "CLI on-device Tests bestanden"

  - name: test-cli-remote
    image: python:3.12-alpine
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      BBCLI: ./bin/bbcli-linux-amd64
    commands:
      - mkdir -p .step-status
      - pip install pytest pytest-json-report --break-system-packages -q
      - chmod +x bin/bbcli-linux-amd64
      - pytest tests/cli/test_cli.py -v --timeout=30 --json-report --json-report-file=reports/cli-tests.json || true
      - echo pass > .step-status/test-cli-remote

  - name: promote-to-stable
    image: alpine
    depends_on:
      - test-hardware
      - test-api
      - test-uart-on-bbb
      - test-cli-on-bbb
      - test-cli-remote
    environment:
      GIT_TOKEN: {from_secret: git_token}
    commands:
      - mkdir -p .step-status
      - apk add --no-cache curl jq git
      - |
        OLD_TAG=$DRONE_TAG
        VERSION=${OLD_TAG%-toTestOnTarget}
        NEW_TAG=$VERSION-stable
        echo "Promoting $OLD_TAG -> $NEW_TAG"
        curl -sf -X POST "https://api.github.com/repos/$DRONE_REPO/releases" \
          -H "Authorization: token $GIT_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"${NEW_TAG}\",\"name\":\"${VERSION}\",\"prerelease\":false}"
        echo "Promoted zu $NEW_TAG"
      - echo pass > .step-status/promote-to-stable

  - name: generate-junit
    image: alpine
    depends_on: [download-release-assets, test-hardware, test-api, test-uart-on-bbb, test-cli-remote, promote-to-stable]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 10-integration-tests download-release-assets test-hardware test-api test-uart-on-bbb test-cli-remote promote-to-stable
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 10-integration-tests
      - echo "Allure Report http://192.168.2.55/downloads/10-integration-tests/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/10-integration-tests/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/10-integration-tests && unzip -o allure-report.zip
    when:
      status: [success, failure]

