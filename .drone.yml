---
# ════════════════════════════════════════
# PIPELINE 9 — Builder Images
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 9-build-container

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, custom]
  branch:
    exclude: [refs/tags/*]
  paths:
    - docker/**/VERSION
    - docker/**/Dockerfile
    - scripts/build-container.sh
    - .drone.yml

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: build-generic-builder
    image: quay.io/podman/stable
    pull: if_not_exists
    privileged: true
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: Bau_token}
      FORCE_REBUILD: ${DRONE_BUILD_PARAM_FORCE}
      STEP: build-generic-builder
      CMD: bash scripts/build-container.sh generic-builder docker/builder/Dockerfile docker/builder docker/builder/VERSION
    commands:
      - sh scripts/run-step.sh

  - name: build-bausteinsicht
    image: quay.io/podman/stable
    pull: if_not_exists
    privileged: true
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: Bau_token}
      STEP: build-bausteinsicht
      CMD: bash scripts/build-container.sh bausteinsicht docker/bausteinsicht/Dockerfile docker/bausteinsicht docker/bausteinsicht/VERSION
    commands:
      - sh scripts/run-step.sh

  - name: build-strictdoc
    image: quay.io/podman/stable
    pull: if_not_exists
    privileged: true
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: Bau_token}
      STEP: build-strictdoc
      CMD: bash scripts/build-container.sh strictdoc docker/strictdoc/Dockerfile docker/strictdoc docker/strictdoc/VERSION
    commands:
      - sh scripts/run-step.sh

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [build-generic-builder, build-bausteinsicht, build-strictdoc]
    commands:
      - sh scripts/save-pipeline-results.sh 9-build-container
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 1 — C & Rust Libraries
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 1-libraries

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom, promote]
  branch:
    exclude: [refs/tags/*]
  paths:
    include:
      - project/c-lib/**
      - project/rust-lib/**
      - project/go-api/pkg/hal/**
      - scripts/build-arm.sh
      - Makefile
      - .drone.yml


volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: cargo-registry
    host:
      path: /var/cache/drone/cargo/registry
  - name: cargo-git
    host:
      path: /var/cache/drone/cargo/git
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results
  - name: build-cache
    host:
      path: /var/cache/drone/build-artifacts

steps:
  - name: build-libraries
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
      - name: cargo-git
        path: /usr/local/cargo/git
    environment:
      SRC: /drone/src
      OUTPUT: /drone/src/bin
      STEP: build-libraries
      CMD: bash scripts/build-arm.sh
    commands:
      - sh scripts/run-step.sh

  - name: save-artifacts
    image: alpine
    pull: if_not_exists
    depends_on: [build-libraries]
    volumes:
      - name: build-cache
        path: /build-cache
    commands:
      - mkdir -p /build-cache/$DRONE_BUILD_NUMBER
      - cp -r bin/ /build-cache/$DRONE_BUILD_NUMBER/
      - mkdir -p /build-cache/$DRONE_BUILD_NUMBER/go-api-libs
      - cp project/go-api/libs/*.so /build-cache/$DRONE_BUILD_NUMBER/go-api-libs/ 2>/dev/null || true
    when:
      status: [success, failure]

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [build-libraries, save-artifacts]
    commands:
      - sh scripts/save-pipeline-results.sh 1-libraries
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 2 — Embedded SW (Go API + HAL)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 2-embedded-sw

depends_on: [1-libraries]

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom]
  branch:
    exclude: [refs/tags/*]
  paths:
    include:
      - project/go-api/**
      - project/c-lib/**
      - project/rust-lib/**
      - scripts/build-arm.sh
      - Makefile
      - .drone.yml

volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: cargo-registry
    host:
      path: /var/cache/drone/cargo/registry
  - name: cargo-git
    host:
      path: /var/cache/drone/cargo/git
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results
  - name: build-cache
    host:
      path: /var/cache/drone/build-artifacts

steps:
  - name: test-hal-unit
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: test-hal-unit
      CMD: "(cd project/go-api && go test ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ -v -count=1)"
    commands:
      - sh scripts/run-step.sh

  - name: lint-go
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: lint-go
      CMD: make lint
    commands:
      - sh scripts/run-step.sh

  - name: restore-artifacts
    image: alpine
    pull: if_not_exists
    depends_on: [test-hal-unit]
    volumes:
      - name: build-cache
        path: /build-cache
    commands:
      - mkdir -p bin project/go-api/libs
      - cp -r /build-cache/$DRONE_BUILD_NUMBER/bin/. bin/
      - cp /build-cache/$DRONE_BUILD_NUMBER/go-api-libs/*.so project/go-api/libs/ 2>/dev/null || true

  - name: deploy-beaglebone
    image: appleboy/drone-scp@sha256:fa5bce5d58d4c265e88519bdee0fcd6d5721888c97dd3f3665632b38e7329384
    pull: if_not_exists
    depends_on: [restore-artifacts]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key_bbb
      source:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-arm
      target: /home/debian/app/
    when:
      branch: [main, develop]
      event: [push]

  - name: restart-service
    image: appleboy/drone-ssh
    pull: if_not_exists
    depends_on: [deploy-beaglebone]
    failure: ignore
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key_bbb
      script:
        - cp /home/debian/app/bin/bbcli-linux-arm /home/debian/app/bbcli
        - "printf '[Unit]\\nDescription=BeagleBone Embedded SW API\\nAfter=network.target\\n\\n[Service]\\nExecStart=/home/debian/app/bin/embedded\\nEnvironment=LD_LIBRARY_PATH=/home/debian/app/project/go-api/libs\\nEnvironment=HW_I2C=/dev/i2c-2\\nEnvironment=HW_BME280_ADDR=0x77\\nRestart=on-failure\\nRestartSec=5\\n\\n[Install]\\nWantedBy=default.target\\n' > ~/.config/systemd/user/embedded-sw.service"
        - export XDG_RUNTIME_DIR=/run/user/$(id -u) && systemctl --user daemon-reload && systemctl --user restart embedded-sw
        - sleep 5
        - export XDG_RUNTIME_DIR=/run/user/$(id -u) && systemctl --user is-active embedded-sw
    when:
      branch: [main, develop]
      event: [push]

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [test-hal-unit, lint-go, restore-artifacts, restart-service]
    commands:
      - sh scripts/save-pipeline-results.sh 2-embedded-sw
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE apps-build-test — Apps (CLI, TUI, WebApp)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: apps-build-test

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom, promote, tag]
  branch:
    exclude: [refs/tags/*]
  paths:
    include:
      - tools/**
      - .drone.yml

volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: lint-cli
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: lint-cli
      CMD: |
        cd tools/cli && go vet ./...
        test -z "$(gofmt -l .)" || (echo "gofmt: tools/cli/" && exit 1)
    commands:
      - sh scripts/run-step.sh

  - name: lint-tui
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: lint-tui
      CMD: "cd tools/tui && go vet ./..."
    commands:
      - sh scripts/run-step.sh

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    pull: if_not_exists
    environment:
      STEP: shellcheck
      CMD: shellcheck --severity=error scripts/*.sh
    commands:
      - sh scripts/run-step.sh

  - name: validate-web-gui
    image: python:3.12-alpine
    pull: if_not_exists
    environment:
      STEP: validate-web-gui
      CMD: |
        python -c "
        from html.parser import HTMLParser
        class V(HTMLParser): pass
        V().feed(open('tools/web-gui/index.html').read())
        print('HTML valide')
        "
    commands:
      - sh scripts/run-step.sh

  - name: build-cli
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-cli]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      CGO_ENABLED: "0"
      STEP: build-cli
      CMD: |
        mkdir -p bin
        cd tools/cli
        GOOS=linux   GOARCH=amd64          go build -ldflags="-s -w" -o ../../bin/bbcli-linux-amd64 .
        GOOS=linux   GOARCH=arm   GOARM=7  go build -ldflags="-s -w" -o ../../bin/bbcli-linux-arm .
        GOOS=darwin  GOARCH=amd64          go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-amd64 .
        GOOS=darwin  GOARCH=arm64          go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-arm64 .
        GOOS=windows GOARCH=amd64          go build -ldflags="-s -w" -o ../../bin/bbcli-windows-amd64.exe .
    commands:
      - sh scripts/run-step.sh

  - name: build-tui
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-tui]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      CGO_ENABLED: "0"
      STEP: build-tui
      CMD: |
        mkdir -p bin
        cd tools/tui
        GOOS=linux  GOARCH=amd64          go build -ldflags="-s -w" -o ../../bin/bbtui-linux-amd64 .
        GOOS=linux  GOARCH=arm   GOARM=7  go build -ldflags="-s -w" -o ../../bin/bbtui-linux-armv7 .
        GOOS=darwin GOARCH=amd64          go build -ldflags="-s -w" -o ../../bin/bbtui-darwin-amd64 .
    commands:
      - sh scripts/run-step.sh

  - name: package-web-gui
    image: alpine
    pull: if_not_exists
    depends_on: [validate-web-gui]
    environment:
      STEP: package-web-gui
      CMD: |
        apk add --no-cache zip
        mkdir -p bin/web-gui
        cp tools/web-gui/index.html bin/web-gui/
        echo "${DRONE_TAG:-dev}" > bin/web-gui/version.txt
        (cd bin && zip -r bbweb-gui.zip web-gui/)
    commands:
      - sh scripts/run-step.sh

  - name: checksums
    image: alpine
    pull: if_not_exists
    depends_on: [build-cli, build-tui, package-web-gui]
    environment:
      STEP: checksums
      CMD: "(cd bin && sha256sum bbcli-* bbtui-* bbweb-gui.zip > checksums.sha256 && cat checksums.sha256)"
    commands:
      - sh scripts/run-step.sh

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [lint-cli, lint-tui, shellcheck, validate-web-gui, build-cli, build-tui, package-web-gui, checksums]
    commands:
      - sh scripts/save-pipeline-results.sh apps-build-test
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 5 — Release (nur bei Tags)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 5-release

depends_on: [apps-build-test]

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [tag]
  ref:
    exclude: [refs/tags/*-toTestOnTarget, refs/tags/*-stable]


volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: cargo-registry
    host:
      path: /var/cache/drone/cargo/registry
  - name: cargo-git
    host:
      path: /var/cache/drone/cargo/git
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: build-arm
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
      - name: cargo-git
        path: /usr/local/cargo/git
    environment:
      SRC: /drone/src
      OUTPUT: /drone/src/bin
      JUNIT: ""
      STEP: build-arm
      CMD: bash scripts/build-arm.sh
    commands:
      - sh scripts/run-step.sh

  - name: build-tools
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: build-tools
      CMD: |
        mkdir -p bin
        cd tools/cli
        GOOS=linux  GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-linux-amd64 .
        GOOS=linux  GOARCH=arm GOARM=7  CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-linux-arm .
        GOOS=darwin GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-amd64 .
        GOOS=darwin GOARCH=arm64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-arm64 .
        GOOS=windows GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-windows-amd64.exe .
        cd ../tui
        GOOS=linux  GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-linux-amd64 .
        GOOS=linux  GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-linux-armv7 .
        GOOS=darwin GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-darwin-amd64 .
    commands:
      - sh scripts/run-step.sh

  - name: build-web-gui
    image: alpine
    pull: if_not_exists
    environment:
      STEP: build-web-gui
      CMD: |
        apk add --no-cache zip
        mkdir -p bin/web-gui
        cp tools/web-gui/index.html bin/web-gui/
        echo "$DRONE_TAG" > bin/web-gui/version.txt
        (cd bin && zip -r bbweb-gui.zip web-gui/)
    commands:
      - sh scripts/run-step.sh

  - name: checksums
    image: alpine
    pull: if_not_exists
    depends_on: [build-arm, build-tools, build-web-gui]
    environment:
      STEP: checksums
      CMD: "(cd bin && sha256sum embedded bbcli-* bbtui-* bbweb-gui.zip > checksums.sha256 && cat checksums.sha256)"
    commands:
      - sh scripts/run-step.sh

  - name: build-docker-image
    image: quay.io/podman/stable
    pull: if_not_exists
    privileged: true
    depends_on: [build-arm]
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: Bau_token}
      STEP: build-docker-image
      CMD: |
        podman login ghcr.io -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"
        podman build --platform linux/arm/v7 -f project/go-api/Dockerfile.embedded -t ghcr.io/$REGISTRY_USER/embedded-sw:$DRONE_TAG -t ghcr.io/$REGISTRY_USER/embedded-sw:latest .
        podman push ghcr.io/$REGISTRY_USER/embedded-sw:$DRONE_TAG
        podman push ghcr.io/$REGISTRY_USER/embedded-sw:latest
    commands:
      - sh scripts/run-step.sh

  - name: create-release
    image: plugins/github-release
    pull: if_not_exists
    depends_on: [build-docker-image, checksums]
    settings:
      api_key: {from_secret: github_token}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbcli-darwin-amd64
        - bin/bbcli-darwin-arm64
        - bin/bbcli-windows-amd64.exe
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/bbtui-darwin-amd64
        - bin/bbweb-gui.zip
        - bin/checksums.sha256
      checksum: [sha256]
      title: "Release $DRONE_TAG"

  - name: create-toTestOnTarget-release
    image: plugins/github-release
    pull: if_not_exists
    depends_on: [create-release]
    settings:
      api_key: {from_secret: github_token}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/checksums.sha256
      checksum: [sha256]
      title: "$DRONE_TAG-toTestOnTarget"
      tag: "$DRONE_TAG-toTestOnTarget"
      prerelease: true

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [build-arm, build-tools, build-web-gui, checksums, build-docker-image]
    commands:
      - sh scripts/save-pipeline-results.sh 5-release
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 6 — Nightly (täglich 02:00)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 6-nightly

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [cron]
  cron: [nightly]

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: test-all-backends
    image: python:3.12-alpine
    pull: if_not_exists
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      STEP: test-all-backends
      CMD: |
        pip install pytest pytest-timeout requests --break-system-packages -q
        for backend in c rust auto; do echo "=== Backend $backend ==="; HW_BACKEND=$backend pytest tests/hardware/ -v --timeout=60 || exit 1; done
    commands:
      - sh scripts/run-step.sh

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [test-all-backends]
    commands:
      - sh scripts/save-pipeline-results.sh 6-nightly
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE sw-unit-tests — Unit Tests & Coverage
# ════════════════════════════════════════
kind: pipeline
type: docker
