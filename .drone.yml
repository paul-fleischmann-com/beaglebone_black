---
kind: pipeline
type: docker
name: ci-smoke

trigger:
  event: [push, pull_request]
  branch: [develop, main]

steps:
  - name: lint
    image: golang:1.22
    commands:
      - cd scripts/drone-lint && go run check_drone_yml.go ../../.drone.yml

  - name: test-go
    image: golang:1.22
    depends_on: [lint]
    commands:
      - cd project/go-api && go test ./pkg/hal/... -v -count=1

  - name: test-python
    image: python:3.11
    depends_on: [lint]
    commands:
      - pip install pytest requests --quiet
      - pytest tests/api/ -v --timeout=10
