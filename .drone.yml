# ════════════════════════════════════════
# PIPELINE 10 — Integration Tests (on-target)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 10-integration-tests

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [tag]
  ref:
    include: [refs/tags/*-toTestOnTarget]

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: download-release-assets
    image: alpine
    pull: if_not_exists
    environment:
      GIT_TOKEN: {from_secret: git_token}
      STEP: download-release-assets
      CMD: |
        apk add --no-cache curl jq
        mkdir -p bin
        TAG=$DRONE_TAG
        curl -sL -H "Authorization: token $GIT_TOKEN" \
          "https://api.github.com/repos/$DRONE_REPO/releases/tags/$TAG" \
          | jq -r '.assets[] | .browser_download_url' \
          | while read url; do
              NAME=$(basename "$url")
              curl -sL -H "Authorization: token $GIT_TOKEN" -o "bin/$NAME" "$url"
              echo "Downloaded: $NAME"
            done
        ls -lh bin/
    commands:
      - sh scripts/run-step.sh

  - name: deploy-to-bbb
    image: appleboy/drone-scp@sha256:fa5bce5d58d4c265e88519bdee0fcd6d5721888c97dd3f3665632b38e7329384
    pull: if_not_exists
    depends_on: [download-release-assets]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      source:
        - bin/embedded
        - bin/libhardware.so
        - bin/libhardware_rs.so
        - bin/bbcli-linux-arm
      target: /home/debian/bin/

  - name: restart-bbb-service
    image: appleboy/drone-ssh
    pull: if_not_exists
    depends_on: [deploy-to-bbb]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      script:
        - cp ~/bin/bbcli-linux-arm ~/bin/bbcli
        - chmod +x ~/bin/*
        - echo "Deploy abgeschlossen"

  - name: test-hardware
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      STEP: test-hardware
      CMD: |
        pip install pytest requests pytest-json-report --break-system-packages -q
        pytest tests/hardware/test_hardware.py -v --timeout=60 --json-report --json-report-file=reports/hardware-tests.json || true
    commands:
      - sh scripts/run-step.sh

  - name: test-api
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      STEP: test-api
      CMD: |
        pip install pytest requests pytest-json-report --break-system-packages -q
        pytest tests/api/test_api.py -v --timeout=30 --json-report --json-report-file=reports/api-tests.json || true
    commands:
      - sh scripts/run-step.sh

  - name: test-uart-on-bbb
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      BEAGLE_USER:
        from_secret: beagle_user
      BBCLI_REMOTE: /home/debian/bin/bbcli
      STEP: test-uart-on-bbb
      CMD: |
        pip install pytest --break-system-packages -q
        pytest tests/hardware/test_uart.py -v --timeout=30 --json-report --json-report-file=reports/uart-tests.json || true
    commands:
      - sh scripts/run-step.sh

  - name: test-cli-on-bbb
    image: appleboy/drone-ssh
    pull: if_not_exists
    depends_on: [restart-bbb-service]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      script:
        - ~/bin/bbcli --version
        - ~/bin/bbcli system status
        - ~/bin/bbcli bme280 read
        - echo "CLI on-device Tests bestanden"

  - name: test-cli-remote
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      BBCLI: ./bin/bbcli-linux-amd64
      STEP: test-cli-remote
      CMD: |
        pip install pytest pytest-json-report --break-system-packages -q
        chmod +x bin/bbcli-linux-amd64
        pytest tests/cli/test_cli.py -v --timeout=30 --json-report --json-report-file=reports/cli-tests.json || true
    commands:
      - sh scripts/run-step.sh

  - name: promote-to-stable
    image: alpine
    pull: if_not_exists
    depends_on:
      - test-hardware
      - test-api
      - test-uart-on-bbb
      - test-cli-on-bbb
      - test-cli-remote
    environment:
      GIT_TOKEN: {from_secret: git_token}
      STEP: promote-to-stable
      CMD: |
        apk add --no-cache curl jq git
        OLD_TAG=$DRONE_TAG
        VERSION=${OLD_TAG%-toTestOnTarget}
        NEW_TAG=$VERSION-stable
        echo "Promoting $OLD_TAG -> $NEW_TAG"
        curl -sf -X POST "https://api.github.com/repos/$DRONE_REPO/releases" \
          -H "Authorization: token $GIT_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"${NEW_TAG}\",\"name\":\"${VERSION}\",\"prerelease\":false}"
        echo "Promoted zu $NEW_TAG"
    commands:
      - sh scripts/run-step.sh

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [download-release-assets, test-hardware, test-api, test-uart-on-bbb, test-cli-remote, promote-to-stable]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 10-integration-tests download-release-assets test-hardware test-api test-uart-on-bbb test-cli-remote promote-to-stable
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 10-integration-tests
      - echo "Allure Report http://192.168.2.55/downloads/10-integration-tests/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=10-integration-tests
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 11 — Version Bump & Release
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 11-version-bump

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [promote]
  target: [release-patch, release-minor, release-major]

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: bump-version
    image: alpine/git
    pull: if_not_exists
    environment:
      GIT_TOKEN: {from_secret: git_token}
      GIT_USER:  {from_secret: git_user}
      STEP: bump-version
      CMD: |
        BUMP=${DRONE_DEPLOY_TO##release-}
        CURRENT=$(grep '^VERSION' Makefile | awk '{print $3}')
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        case "$BUMP" in
          major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR+1)); PATCH=0 ;;
          patch) PATCH=$((PATCH+1)) ;;
        esac
        NEW="${MAJOR}.${MINOR}.${PATCH}"
        sed -i "s/^VERSION = .*/VERSION = $NEW/" Makefile
        git config user.name "drone-ci[bot]"
        git config user.email "drone-ci[bot]@noreply"
        git add Makefile CHANGELOG.md
        git commit -m "chore(release): bump version to ${NEW} [skip ci]"
        git tag "v${NEW}"
        git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} HEAD:main
        git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} "v${NEW}"
    commands:
      - sh scripts/run-step.sh

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [bump-version]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 11-version-bump bump-version
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 11-version-bump
      - echo "Allure Report http://192.168.2.55/downloads/11-version-bump/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=11-version-bump
    when:
      status: [success, failure]

