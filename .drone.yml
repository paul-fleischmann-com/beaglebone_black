# ════════════════════════════════════════
# PIPELINE 12 — Changelog Update
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 12-changelog

trigger:
  event: [push, pull_request, custom]
  branch: [main]
  paths:
    - project/**
    - tools/**

steps:
  - name: update-changelog
    image: alpine/git
    environment:
      GIT_TOKEN: {from_secret: git_token}
      GIT_USER:  {from_secret: git_user}
    commands:
      - mkdir -p .step-status
      - apk add --no-cache curl tar jq
      - |
        LATEST=$(curl -sf https://api.github.com/repos/orhun/git-cliff/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
        curl -sSfL "https://github.com/orhun/git-cliff/releases/download/$LATEST/git-cliff-x86_64-unknown-linux-musl.tar.gz" \
          | tar -xz -C /tmp
        find /tmp -name "git-cliff" -type f -exec mv {} /usr/local/bin/ \;
        chmod +x /usr/local/bin/git-cliff
      - git-cliff --unreleased --output unreleased.md
      - make prepend-changelog
      - git config user.name "drone-ci[bot]"
      - git config user.email "drone-ci[bot]@noreply"
      - git add CHANGELOG.md
      - |
        if git diff --cached --quiet; then
          echo "Keine Changelog-Änderungen"
        else
          git commit -m "docs(changelog): update unreleased section [skip ci]"
          git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} HEAD:main
        fi
      - echo pass > .step-status/update-changelog

  - name: generate-junit
    image: alpine
    depends_on: [update-changelog]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 12-changelog update-changelog
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 12-changelog
      - echo "Allure Report http://192.168.2.55/downloads/12-changelog/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/12-changelog/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
