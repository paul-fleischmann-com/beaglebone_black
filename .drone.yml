# ════════════════════════════════════════
# PIPELINE 11 — Version Bump & Release
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 11-version-bump

trigger:
  event: [promote]
  target: [release-patch, release-minor, release-major]

steps:
  - name: bump-version
    image: alpine/git
    environment:
      GIT_TOKEN: {from_secret: git_token}
      GIT_USER:  {from_secret: git_user}
    commands:
      - mkdir -p .step-status
      - |
        BUMP=${DRONE_DEPLOY_TO##release-}
        CURRENT=$(grep '^VERSION' Makefile | awk '{print $3}')
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        case "$BUMP" in
          major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR+1)); PATCH=0 ;;
          patch) PATCH=$((PATCH+1)) ;;
        esac
        NEW="${MAJOR}.${MINOR}.${PATCH}"
        sed -i "s/^VERSION = .*/VERSION = $NEW/" Makefile
        git config user.name "drone-ci[bot]"
        git config user.email "drone-ci[bot]@noreply"
        git add Makefile CHANGELOG.md
        git commit -m "chore(release): bump version to ${NEW} [skip ci]"
        git tag "v${NEW}"
        git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} HEAD:main
        git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} "v${NEW}"
      - echo pass > .step-status/bump-version

  - name: generate-junit
    image: alpine
    depends_on: [bump-version]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 11-version-bump bump-version
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 11-version-bump
      - echo "Allure Report http://192.168.2.55/downloads/11-version-bump/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/11-version-bump/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/11-version-bump && unzip -o allure-report.zip
    when:
      status: [success, failure]

