---
# ════════════════════════════════════════
# PIPELINE 1 — C & Rust Libraries
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 1-libraries

trigger:
  event: [push, pull_request, custom]
  branch: [main]
  paths:
    - project/c-lib/**
    - project/rust-lib/**
    - project/go-api/pkg/hal/**
    - scripts/build-arm.sh
    - docker/builder/**

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: build-libraries
    image: ghcr.io/paulefl/generic-builder:latest
    environment:
      SRC: /drone/src
      OUTPUT: /drone/src/bin
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-libraries.start
      - bash scripts/build-arm.sh
      - echo $(($(date +%s) - $(cat .step-status/build-libraries.start 2>/dev/null || date +%s))) > .step-status/build-libraries

  - name: test-c-lib-pytest
    image: ghcr.io/paulefl/generic-builder:latest
    depends_on: [build-libraries]
    commands:
      - mkdir -p .step-status allure-results reports && date +%s > .step-status/test-c-lib-pytest.start
      - pip install --quiet pytest allure-pytest
      - make -C c-lib test-bin
      - pytest tests/c_lib/ --alluredir=allure-results -v || true
      - make -C c-lib test
      - echo $(($(date +%s) - $(cat .step-status/test-c-lib-pytest.start 2>/dev/null || date +%s))) > .step-status/test-c-lib-pytest

  - name: test-c-lib-go
    image: ghcr.io/paulefl/generic-builder:latest
    depends_on: [build-libraries]
    commands:
      - mkdir -p .step-status allure-results && date +%s > .step-status/test-c-lib-go.start
      - make -C c-lib test-bin
      - cd tools/c_test_runner && go mod tidy && go test -v ./... -count=1
      - echo $(($(date +%s) - $(cat .step-status/test-c-lib-go.start 2>/dev/null || date +%s))) > .step-status/test-c-lib-go

  - name: test-rust-lib
    image: ghcr.io/paulefl/generic-builder:latest
    depends_on: [build-libraries]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/test-rust-lib.start
      - cargo test --manifest-path project/rust-lib/Cargo.toml
      - echo $(($(date +%s) - $(cat .step-status/test-rust-lib.start 2>/dev/null || date +%s))) > .step-status/test-rust-lib

  - name: test-go
    image: ghcr.io/paulefl/generic-builder:latest
    depends_on: [build-libraries]
    environment:
      COVERPKG: ./pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/
      TEST_PACKAGES: ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/
    commands:
      - mkdir -p .step-status && date +%s > .step-status/test-go.start
      - cd project/go-api
      - mkdir -p ../../reports
      - >-
        gotestsum
        --junitfile ../../reports/go-tests-junit.xml
        --jsonfile  ../../reports/go-tests.json
        --
        -race -count=3
        -coverprofile=coverage.out
        -covermode=atomic
        -coverpkg=$COVERPKG
        $TEST_PACKAGES
      - |
        total=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
        echo "Coverage: ${total}%"
        awk "BEGIN{exit !($total >= 75)}" || (echo "Coverage gate: ${total}% < 75%" && exit 1)
        echo "Coverage gate: ${total}% >= 75%"
      - echo $(($(date +%s) - $(cat .step-status/test-go.start 2>/dev/null || date +%s))) > .step-status/test-go

  - name: junit-reports-pipe1
    image: ghcr.io/rohit-gohri/drone-junit:v0
    depends_on: [build-libraries, test-c-lib-pytest, test-c-lib-go, test-go]
    settings:
      paths: reports/*.xml
      report_name: "Pipe 1 - Build & Tests"
    when:
      status: [success, failure]

  - name: generate-junit
    image: alpine
    depends_on: [build-libraries, test-c-lib-pytest, test-c-lib-go, test-rust-lib, test-go]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 1-libraries build-libraries test-c-lib-pytest test-c-lib-go test-rust-lib test-go
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 1-libraries
      - echo "Allure Report http://192.168.2.55/downloads/1-libraries/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/1-libraries/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/1-libraries && unzip -o allure-report.zip
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 2 — Embedded SW (Go API + HAL)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 2-embedded-sw

trigger:
  event: [push, pull_request, custom]
  branch: [main]
  paths:
    - project/go-api/**
    - project/c-lib/**
    - project/rust-lib/**
    - scripts/build-arm.sh

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: test-hal-unit
    image: golang:1.24
    commands:
      - mkdir -p .step-status && date +%s > .step-status/test-hal-unit.start
      - cd project/go-api && go test ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ -v -count=1
      - echo $(($(date +%s) - $(cat .step-status/test-hal-unit.start 2>/dev/null || date +%s))) > .step-status/test-hal-unit

  - name: lint-go
    image: golang:1.24
    commands:
      - mkdir -p .step-status && date +%s > .step-status/lint-go.start
      - make lint
      - echo $(($(date +%s) - $(cat .step-status/lint-go.start 2>/dev/null || date +%s))) > .step-status/lint-go

  - name: build-go-api
    image: ghcr.io/paulefl/generic-builder:latest
    depends_on: [test-hal-unit]
    environment:
      SRC: /drone/src
      OUTPUT: /drone/src/bin
      JUNIT: ""
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-go-api.start
      - bash scripts/build-arm.sh
      - echo $(($(date +%s) - $(cat .step-status/build-go-api.start 2>/dev/null || date +%s))) > .step-status/build-go-api

  - name: deploy-beaglebone
    image: appleboy/drone-scp
    depends_on: [build-go-api]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      source:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-arm
      target: /app/
    when:
      branch: [main, develop]
      event: [push]

  - name: restart-service
    image: appleboy/drone-ssh
    depends_on: [deploy-beaglebone]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      script:
        - cp /app/bbcli-linux-arm /app/bbcli
        - systemctl restart embedded-sw
        - sleep 3
        - systemctl is-active embedded-sw
    when:
      branch: [main, develop]
      event: [push]

  - name: test-hardware-all-backends
    image: python:3.12-alpine
    depends_on: [restart-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
    commands:
      - mkdir -p .step-status && date +%s > .step-status/test-hardware-all-backends.start
      - pip install pytest requests --break-system-packages -q
      - for backend in c rust auto; do echo "=== Backend $backend ==="; HW_BACKEND=$backend pytest tests/hardware/ -v --timeout=60 || exit 1; done
      - echo $(($(date +%s) - $(cat .step-status/test-hardware-all-backends.start 2>/dev/null || date +%s))) > .step-status/test-hardware-all-backends
    when:
      branch: [main, develop]
      event: [push]

  - name: generate-junit
    image: alpine
    depends_on: [test-hal-unit, lint-go, build-go-api, test-hardware-all-backends]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 2-embedded-sw test-hal-unit lint-go build-go-api test-hardware-all-backends
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 2-embedded-sw
      - echo "Allure Report http://192.168.2.55/downloads/2-embedded-sw/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/2-embedded-sw/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/2-embedded-sw && unzip -o allure-report.zip
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 3 — Tools (CLI + TUI + GUI)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 3-tools

trigger:
  event: [push, pull_request, custom]
  branch: [main]
  paths:
    - tools/**

steps:
  - name: lint-cli
    image: golang:1.24
    commands:
      - mkdir -p .step-status && date +%s > .step-status/lint-cli.start
      - cd tools/cli && go mod tidy && go vet ./...
      - |
        test -z "$(gofmt -l tools/cli/)" || (echo "gofmt: tools/cli/" && exit 1)
      - echo $(($(date +%s) - $(cat .step-status/lint-cli.start 2>/dev/null || date +%s))) > .step-status/lint-cli

  - name: lint-tui
    image: golang:1.24
    commands:
      - mkdir -p .step-status && date +%s > .step-status/lint-tui.start
      - cd tools/tui && go mod tidy && go vet ./...
      - echo $(($(date +%s) - $(cat .step-status/lint-tui.start 2>/dev/null || date +%s))) > .step-status/lint-tui

  - name: build-cli-linux-amd64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-cli-linux-amd64.start
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-linux-amd64 .
      - echo $(($(date +%s) - $(cat .step-status/build-cli-linux-amd64.start 2>/dev/null || date +%s))) > .step-status/build-cli-linux-amd64

  - name: build-cli-linux-arm
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
      CGO_ENABLED: "0"
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-cli-linux-arm.start
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-linux-arm .
      - echo $(($(date +%s) - $(cat .step-status/build-cli-linux-arm.start 2>/dev/null || date +%s))) > .step-status/build-cli-linux-arm

  - name: build-cli-darwin-amd64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-cli-darwin-amd64.start
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-amd64 .
      - echo $(($(date +%s) - $(cat .step-status/build-cli-darwin-amd64.start 2>/dev/null || date +%s))) > .step-status/build-cli-darwin-amd64

  - name: build-cli-darwin-arm64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: darwin
      GOARCH: arm64
      CGO_ENABLED: "0"
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-cli-darwin-arm64.start
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-arm64 .
      - echo $(($(date +%s) - $(cat .step-status/build-cli-darwin-arm64.start 2>/dev/null || date +%s))) > .step-status/build-cli-darwin-arm64

  - name: build-cli-windows-amd64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-cli-windows-amd64.start
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-windows-amd64.exe .
      - echo $(($(date +%s) - $(cat .step-status/build-cli-windows-amd64.start 2>/dev/null || date +%s))) > .step-status/build-cli-windows-amd64

  - name: build-tui-linux-amd64
    image: golang:1.24
    depends_on: [lint-tui]
    environment:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-tui-linux-amd64.start
      - cd tools/tui && go build -ldflags="-s -w" -o ../../bin/bbtui-linux-amd64 .
      - echo $(($(date +%s) - $(cat .step-status/build-tui-linux-amd64.start 2>/dev/null || date +%s))) > .step-status/build-tui-linux-amd64

  - name: build-tui-linux-armv7
    image: golang:1.24
    depends_on: [lint-tui]
    environment:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
      CGO_ENABLED: "0"
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-tui-linux-armv7.start
      - cd tools/tui && go build -ldflags="-s -w" -o ../../bin/bbtui-linux-armv7 .
      - echo $(($(date +%s) - $(cat .step-status/build-tui-linux-armv7.start 2>/dev/null || date +%s))) > .step-status/build-tui-linux-armv7

  - name: build-tui-darwin-amd64
    image: golang:1.24
    depends_on: [lint-tui]
    environment:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-tui-darwin-amd64.start
      - cd tools/tui && go build -ldflags="-s -w" -o ../../bin/bbtui-darwin-amd64 .
      - echo $(($(date +%s) - $(cat .step-status/build-tui-darwin-amd64.start 2>/dev/null || date +%s))) > .step-status/build-tui-darwin-amd64

  - name: validate-web-gui
    image: python:3.12-alpine
    commands:
      - mkdir -p .step-status && date +%s > .step-status/validate-web-gui.start
      - |
        python -c "
        from html.parser import HTMLParser
        class V(HTMLParser): pass
        V().feed(open('tools/web-gui/index.html').read())
        print('HTML valide')
        "
      - echo $(($(date +%s) - $(cat .step-status/validate-web-gui.start 2>/dev/null || date +%s))) > .step-status/validate-web-gui

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - mkdir -p .step-status && date +%s > .step-status/shellcheck.start
      - shellcheck --severity=error scripts/*.sh
      - echo $(($(date +%s) - $(cat .step-status/shellcheck.start 2>/dev/null || date +%s))) > .step-status/shellcheck

  - name: checksums
    image: alpine
    depends_on:
      - build-cli-linux-amd64
      - build-cli-linux-arm
      - build-cli-darwin-amd64
      - build-cli-darwin-arm64
      - build-cli-windows-amd64
      - build-tui-linux-amd64
      - build-tui-linux-armv7
      - build-tui-darwin-amd64
    commands:
      - mkdir -p .step-status && date +%s > .step-status/checksums.start
      - cd bin && sha256sum bbcli-* bbtui-* > checksums.sha256 && cat checksums.sha256
      - echo $(($(date +%s) - $(cat .step-status/checksums.start 2>/dev/null || date +%s))) > .step-status/checksums

  - name: generate-junit
    image: alpine
    depends_on: [lint-cli, lint-tui, build-cli-linux-amd64, build-cli-linux-arm, build-cli-darwin-amd64, build-cli-darwin-arm64, build-cli-windows-amd64, build-tui-linux-amd64, build-tui-linux-armv7, build-tui-darwin-amd64, validate-web-gui, shellcheck, checksums]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 3-tools lint-cli lint-tui build-cli-linux-amd64 build-cli-linux-arm build-cli-darwin-amd64 build-cli-darwin-arm64 build-cli-windows-amd64 build-tui-linux-amd64 build-tui-linux-armv7 build-tui-darwin-amd64 validate-web-gui shellcheck checksums
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 3-tools
      - echo "Allure Report http://192.168.2.55/downloads/3-tools/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/3-tools/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/3-tools && unzip -o allure-report.zip
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 4 — WebApp Frontend
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 4-webapp

trigger:
  event: [push, pull_request, custom]
  branch: [main]
  paths:
    - tools/web-gui/**

steps:
  - name: validate-html
    image: python:3.12-alpine
    commands:
      - mkdir -p .step-status && date +%s > .step-status/validate-html.start
      - |
        python -c "
        from html.parser import HTMLParser
        class V(HTMLParser): pass
        V().feed(open('tools/web-gui/index.html').read())
        print('HTML valide')
        "
      - echo $(($(date +%s) - $(cat .step-status/validate-html.start 2>/dev/null || date +%s))) > .step-status/validate-html

  - name: package-web-gui
    image: alpine
    depends_on: [validate-html]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/package-web-gui.start
      - apk add --no-cache zip
      - mkdir -p bin/web-gui
      - cp tools/web-gui/index.html bin/web-gui/
      - |
        echo "${DRONE_TAG:-dev}" > bin/web-gui/version.txt
      - cd bin && zip -r bbweb-gui.zip web-gui/
      - echo $(($(date +%s) - $(cat .step-status/package-web-gui.start 2>/dev/null || date +%s))) > .step-status/package-web-gui

  - name: generate-junit
    image: alpine
    depends_on: [validate-html, package-web-gui]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 4-webapp validate-html package-web-gui
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 4-webapp
      - echo "Allure Report http://192.168.2.55/downloads/4-webapp/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/4-webapp/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/4-webapp && unzip -o allure-report.zip
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 5 — Release (nur bei Tags)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 5-release

trigger:
  event: [tag]
  ref:
    exclude: [refs/tags/*-toTestOnTarget, refs/tags/*-stable]

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: build-arm
    image: ghcr.io/paulefl/generic-builder:latest
    environment:
      SRC: /drone/src
      OUTPUT: /drone/src/bin
      JUNIT: ""
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-arm.start
      - bash scripts/build-arm.sh
      - echo $(($(date +%s) - $(cat .step-status/build-arm.start 2>/dev/null || date +%s))) > .step-status/build-arm

  - name: build-cli
    image: golang:1.24
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-cli.start
      - cd tools/cli
      - GOOS=linux  GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-linux-amd64 .
      - GOOS=linux  GOARCH=arm GOARM=7  CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-linux-arm .
      - GOOS=darwin GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-amd64 .
      - GOOS=darwin GOARCH=arm64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-arm64 .
      - GOOS=windows GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-windows-amd64.exe .
      - echo $(($(date +%s) - $(cat .step-status/build-cli.start 2>/dev/null || date +%s))) > .step-status/build-cli

  - name: build-tui
    image: golang:1.24
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-tui.start
      - cd tools/tui
      - GOOS=linux  GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-linux-amd64 .
      - GOOS=linux  GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-linux-armv7 .
      - GOOS=darwin GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-darwin-amd64 .
      - echo $(($(date +%s) - $(cat .step-status/build-tui.start 2>/dev/null || date +%s))) > .step-status/build-tui

  - name: build-web-gui
    image: alpine
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-web-gui.start
      - apk add --no-cache zip
      - mkdir -p bin/web-gui
      - cp tools/web-gui/index.html bin/web-gui/
      - echo "$DRONE_TAG" > bin/web-gui/version.txt
      - cd bin && zip -r bbweb-gui.zip web-gui/
      - echo $(($(date +%s) - $(cat .step-status/build-web-gui.start 2>/dev/null || date +%s))) > .step-status/build-web-gui

  - name: checksums
    image: alpine
    depends_on: [build-arm, build-cli, build-tui, build-web-gui]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/checksums.start
      - cd bin && sha256sum embedded bbcli-* bbtui-* bbweb-gui.zip > checksums.sha256 && cat checksums.sha256
      - echo $(($(date +%s) - $(cat .step-status/checksums.start 2>/dev/null || date +%s))) > .step-status/checksums

  - name: build-docker-image
    image: quay.io/podman/stable
    privileged: true
    depends_on: [build-arm]
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: Bau_token}
    commands:
      - mkdir -p .step-status && date +%s > .step-status/build-docker-image.start
      - podman login ghcr.io -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"
      - podman build --platform linux/arm/v7 -f project/go-api/Dockerfile.embedded -t ghcr.io/$REGISTRY_USER/embedded-sw:$DRONE_TAG -t ghcr.io/$REGISTRY_USER/embedded-sw:latest .
      - podman push ghcr.io/$REGISTRY_USER/embedded-sw:$DRONE_TAG
      - podman push ghcr.io/$REGISTRY_USER/embedded-sw:latest
      - echo $(($(date +%s) - $(cat .step-status/build-docker-image.start 2>/dev/null || date +%s))) > .step-status/build-docker-image

  - name: create-release
    image: plugins/github-release
    depends_on: [build-docker-image, checksums]
    settings:
      api_key: {from_secret: github_token}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbcli-darwin-amd64
        - bin/bbcli-darwin-arm64
        - bin/bbcli-windows-amd64.exe
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/bbtui-darwin-amd64
        - bin/bbweb-gui.zip
        - bin/checksums.sha256
      checksum: [sha256]
      title: "Release $DRONE_TAG"

  - name: create-toTestOnTarget-release
    image: plugins/github-release
    depends_on: [create-release]
    settings:
      api_key: {from_secret: github_token}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/checksums.sha256
      checksum: [sha256]
      title: "$DRONE_TAG-toTestOnTarget"
      tag: "$DRONE_TAG-toTestOnTarget"
      prerelease: true

  - name: generate-junit
    image: alpine
    depends_on: [build-arm, build-cli, build-tui, build-web-gui, checksums, build-docker-image]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 5-release build-arm build-cli build-tui build-web-gui checksums build-docker-image
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 5-release
      - echo "Allure Report http://192.168.2.55/downloads/5-release/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/5-release/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/5-release && unzip -o allure-report.zip
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 6 — Nightly (täglich 02:00)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 6-nightly

trigger:
  event: [cron]
  cron: [nightly]

steps:
  - name: test-all-backends
    image: python:3.12-alpine
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
    commands:
      - mkdir -p .step-status && date +%s > .step-status/test-all-backends.start
      - pip install pytest requests --break-system-packages -q
      - for backend in c rust auto; do echo "=== Backend $backend ==="; HW_BACKEND=$backend pytest tests/hardware/ -v --timeout=60 || exit 1; done
      - echo $(($(date +%s) - $(cat .step-status/test-all-backends.start 2>/dev/null || date +%s))) > .step-status/test-all-backends

  - name: notify-slack
    image: plugins/slack
    depends_on: [test-all-backends]
    settings:
      webhook: {from_secret: slack_webhook}
      channel: builds
      template: "Nightly Build {{build.number}} — {{build.status}} {{build.link}}"
    when:
      status: [success, failure]

  - name: generate-junit
    image: alpine
    depends_on: [test-all-backends]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 6-nightly test-all-backends
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 6-nightly
      - echo "Allure Report http://192.168.2.55/downloads/6-nightly/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/6-nightly/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/6-nightly && unzip -o allure-report.zip
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 7 — Reports & Quality Gates
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 7-reports

trigger:
  event: [push, pull_request, custom]
  branch: [main]
  paths:
    - project/**
    - tests/**
    - scripts/**
    - docs/**

steps:
  - name: go-tests-with-coverage
    image: golang:1.24
    commands:
      - mkdir -p .step-status && date +%s > .step-status/go-tests-with-coverage.start
      - mkdir -p reports
      - cd project/go-api
      - go install gotest.tools/gotestsum@v1.12.0
      - |
        gotestsum \
          --junitfile ../../reports/go-tests-junit.xml \
          --jsonfile  ../../reports/go_tests.json \
          -- \
          -count=1 \
          -coverprofile=../../reports/go_coverage.out \
          -covermode=atomic \
          -coverpkg=./pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/ \
          ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ || true
      - go tool cover -func=../../reports/go_coverage.out || true
      - echo $(($(date +%s) - $(cat .step-status/go-tests-with-coverage.start 2>/dev/null || date +%s))) > .step-status/go-tests-with-coverage

  - name: junit-reports-pipe-7
    image: ghcr.io/rohit-gohri/drone-junit:v0
    depends_on: [go-tests-with-coverage]
    settings:
      paths: reports/go-tests-junit.xml
      report_name: "junit-reports - Pipe 7 - go-tests-with-coverage"
    when:
      status: [success, failure]

  - name: python-tests
    image: python:3.12-alpine
    commands:
      - mkdir -p .step-status && date +%s > .step-status/python-tests.start
      - mkdir -p reports
      - pip install -r tests/requirements-dev.txt pytest-json-report --break-system-packages -q
      - pytest tests/ --ignore=tests/hardware/ -v --json-report --json-report-file=reports/python_tests.json --timeout=30 || true
      - echo $(($(date +%s) - $(cat .step-status/python-tests.start 2>/dev/null || date +%s))) > .step-status/python-tests

  - name: python-security
    image: python:3.12-alpine
    commands:
      - mkdir -p .step-status && date +%s > .step-status/python-security.start
      - mkdir -p reports
      - pip install bandit bandit-sarif-formatter --break-system-packages -q
      - bandit -r scripts/ tests/ project/ -f sarif -o reports/python-sarif.json --exclude tests/hardware/ || true
      - echo "Bandit done"
      - echo $(($(date +%s) - $(cat .step-status/python-security.start 2>/dev/null || date +%s))) > .step-status/python-security

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - mkdir -p .step-status && date +%s > .step-status/shellcheck.start
      - mkdir -p reports
      - shellcheck scripts/*.sh 2>&1 | tee reports/shellcheck.txt || true
      - echo $(($(date +%s) - $(cat .step-status/shellcheck.start 2>/dev/null || date +%s))) > .step-status/shellcheck

  - name: c-coverage
    image: debian:bookworm
    commands:
      - mkdir -p .step-status && date +%s > .step-status/c-coverage.start
      - mkdir -p reports
      - apt-get update -q && apt-get install -y -q gcc make lcov
      - make -C c-lib CFLAGS="-fprofile-arcs -ftest-coverage -g" CC=gcc test || true
      - bash scripts/c_coverage.sh c-lib/ reports/c-coverage.info '/usr/*' '*/test/*' || true
      - echo $(($(date +%s) - $(cat .step-status/c-coverage.start 2>/dev/null || date +%s))) > .step-status/c-coverage

  - name: adoc-build
    image: asciidoctor/docker-asciidoctor:latest
    commands:
      - mkdir -p .step-status && date +%s > .step-status/adoc-build.start
      - gem install asciidoctor-pdf rouge --quiet || true
      - ROOT_DIR=. OUTPUT_DIR=reports/docs bash scripts/build_adoc.sh || true
      - find reports/docs -name "*.html" -o -name "*.pdf" | sort || true
      - echo $(($(date +%s) - $(cat .step-status/adoc-build.start 2>/dev/null || date +%s))) > .step-status/adoc-build

  - name: strictdoc-export
    image: python:3.12-slim
    depends_on: [go-tests-with-coverage]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/strictdoc-export.start
      - pip install strictdoc
      - mkdir -p reports/strictdoc
      - strictdoc export . --formats html --output-dir reports/strictdoc || true
      - find reports/strictdoc -name "*.html" | head -10 || true
      - zip -r strictdoc-output.zip build/
      - echo $(($(date +%s) - $(cat .step-status/strictdoc-export.start 2>/dev/null || date +%s))) > .step-status/strictdoc-export

  - name: prepare-reports
    image: alpine
    depends_on: [strictdoc-export]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/prepare-reports.start
      - SHA8=$(echo "$DRONE_COMMIT_SHA" | head -c8)
      - FILE=strictdoc-$SHA8.zip
      - mv strictdoc-output.zip $FILE
      - echo $FILE > artifact_name.txt
      - echo $(($(date +%s) - $(cat .step-status/prepare-reports.start 2>/dev/null || date +%s))) > .step-status/prepare-reports

  - name: upload
    image: appleboy/drone-scp
    depends_on: [prepare-reports]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: strictdoc-*.zip
      target: /var/www/downloads/

  - name: print-url
    image: alpine
    depends_on: [upload]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/print-url.start
      - SHA8=$(echo "$DRONE_COMMIT_SHA" | head -c8)
      - echo "Download URL:"
      - echo "http://192.168.2.55/downloads/strictdoc-$SHA8.zip"
      - echo $(($(date +%s) - $(cat .step-status/print-url.start 2>/dev/null || date +%s))) > .step-status/print-url

  - name: strictdoc-coverage-gate
    image: python:3.12-slim
    depends_on: [strictdoc-export]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/strictdoc-coverage-gate.start
      - |
        python3 scripts/check_req_coverage.py \
          --sdoc-dir docs/requirements \
          --junit-xml reports/go-tests-junit.xml \
          --output-junit reports/req-coverage-junit.xml \
          --min-coverage 70 || true
      - echo $(($(date +%s) - $(cat .step-status/strictdoc-coverage-gate.start 2>/dev/null || date +%s))) > .step-status/strictdoc-coverage-gate

  - name: junit-reports-req-coverage
    image: ghcr.io/rohit-gohri/drone-junit:v0
    depends_on: [strictdoc-coverage-gate]
    settings:
      paths: reports/req-coverage-junit.xml
      report_name: "junit-reports - Req coverage"
    when:
      status: [success, failure]

  - name: sonarqube-report
    image: python:3.12-alpine
    depends_on: [go-tests-with-coverage, c-coverage, python-security]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/sonarqube-report.start
      - pip install requests defusedxml --break-system-packages -q
      - |
        SONAR_TOKEN=$(cat /run/secrets/sonar_token 2>/dev/null || echo "")
        if [ -z "$SONAR_TOKEN" ]; then echo "SONAR_TOKEN nicht gesetzt — übersprungen"; exit 0; fi
        python3 .github/actions/sonarqube-report/sonarqube_report.py --token "$SONAR_TOKEN" --project paulefl_beaglebone_black --output reports/sonar-report.html || true
      - echo $(($(date +%s) - $(cat .step-status/sonarqube-report.start 2>/dev/null || date +%s))) > .step-status/sonarqube-report

  - name: sonarcloud-scan
    image: sonarsource/sonar-scanner-cli:latest
    depends_on: [go-tests-with-coverage, c-coverage, python-security]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/sonarcloud-scan.start
      - |
        sonar-scanner \
            -Dsonar.projectKey=paulefl_beaglebone_black \
            -Dsonar.organization=paulefl \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.go.coverage.reportPaths=reports/go_coverage.out \
            -Dsonar.c.lcov.reportPaths=reports/c-coverage.info \
            || true
      - echo $(($(date +%s) - $(cat .step-status/sonarcloud-scan.start 2>/dev/null || date +%s))) > .step-status/sonarcloud-scan
    when:
      branch: [main, develop]
      event: [push]

  - name: collect-and-report
    image: python:3.12-slim
    depends_on:
      - go-tests-with-coverage
      - python-tests
      - c-coverage
      - adoc-build
    commands:
      - mkdir -p .step-status && date +%s > .step-status/collect-and-report.start
      - pip install reportlab jinja2 --quiet
      - python3 scripts/collect_results.py --workspace reports --output reports/test_results.json || true
      - python3 scripts/generate_reports.py --output reports/summary --results reports/test_results.json --trend reports/test_trend.json || true
      - ls -lh reports/ || true
      - echo $(($(date +%s) - $(cat .step-status/collect-and-report.start 2>/dev/null || date +%s))) > .step-status/collect-and-report

  - name: quality-gates
    image: python:3.12-alpine
    depends_on: [collect-and-report]
    commands:
      - mkdir -p .step-status && date +%s > .step-status/quality-gates.start
      - python3 scripts/collect_results.py --check-gates --results reports/test_results.json --min-success-rate 90 --min-avg-coverage 75 --min-file-coverage 50 || true
      - echo $(($(date +%s) - $(cat .step-status/quality-gates.start 2>/dev/null || date +%s))) > .step-status/quality-gates

  - name: package-artifacts
    image: alpine
    depends_on:
      - collect-and-report
      - adoc-build
      - strictdoc-coverage-gate
      - sonarqube-report
    commands:
      - mkdir -p .step-status && date +%s > .step-status/package-artifacts.start
      - apk add --no-cache zip
      - cd reports && zip -r ../reports-$DRONE_BUILD_NUMBER.zip . 2>/dev/null || true
      - echo "Artifacts gepackt"
      - echo $(($(date +%s) - $(cat .step-status/package-artifacts.start 2>/dev/null || date +%s))) > .step-status/package-artifacts

  - name: notify
    image: plugins/slack
    depends_on: [quality-gates, package-artifacts]
    settings:
      webhook: {from_secret: slack_webhook}
      channel: builds
      template: "Build {{build.number}} — {{build.status}} {{build.link}}"
    when:
      status: [success, failure]
      branch: [main, develop]
      event:  [push, tag]

  - name: generate-junit
    image: alpine
    depends_on: [go-tests-with-coverage, python-tests, python-security, shellcheck, c-coverage, adoc-build, strictdoc-export, prepare-reports, print-url, strictdoc-coverage-gate, sonarqube-report, sonarcloud-scan, collect-and-report, quality-gates, package-artifacts]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 7-reports go-tests-with-coverage python-tests python-security shellcheck c-coverage adoc-build strictdoc-export prepare-reports print-url strictdoc-coverage-gate sonarqube-report sonarcloud-scan collect-and-report quality-gates package-artifacts
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 7-reports
      - echo "Allure Report http://192.168.2.55/downloads/7-reports/allure-report/index.html"
    when:
      status: [success, failure]

  - name: upload-allure
    image: appleboy/drone-scp
    depends_on: [allure-generate]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      source: allure-report.zip
      target: /var/www/downloads/7-reports/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-allure
    image: appleboy/drone-ssh
    depends_on: [upload-allure]
    settings:
      host: 192.168.2.55
      username: deploy
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/7-reports && unzip -o allure-report.zip
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 8 — Bausteinsicht
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 8-bausteinsicht

trigger:
  event: [push, pull_request, custom]
  branch: [main]
  paths:
    - arch/model/**

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: validate-model
    image: ghcr.io/paulefl/bausteinsicht:latest
    commands:
      - mkdir -p .step-status && date +%s > .step-status/validate-model.start
      - bausteinsicht validate --model arch/model/beaglebone_black.jsonc
      - echo $(($(date +%s) - $(cat .step-status/validate-model.start 2>/dev/null || date +%s))) > .step-status/validate-model

  - name: export-plantuml
    image: ghcr.io/paulefl/bausteinsicht:latest
    depends_on: [validate-model]
    commands:
      - mkdir -p .step-status
      - mkdir -p arch/model/export/plantuml
      - bausteinsicht export-diagram --model arch/model/beaglebone_black.jsonc --diagram-format plantuml --output arch/model/export/plantuml
      - echo pass > .step-status/export-plantuml

  - name: export-mermaid
    image: ghcr.io/paulefl/bausteinsicht:latest
    depends_on: [validate-model]
    commands:
      - mkdir -p .step-status
      - mkdir -p arch/model/export/mermaid
      - bausteinsicht export-diagram --model arch/model/beaglebone_black.jsonc --diagram-format mermaid --output arch/model/export/mermaid
      - echo pass > .step-status/export-mermaid

  - name: export-table
    image: ghcr.io/paulefl/bausteinsicht:latest
    depends_on: [validate-model]
    commands:
      - mkdir -p .step-status
      - mkdir -p arch/model/export/table
      - bausteinsicht export-table --model arch/model/beaglebone_black.jsonc --table-format md --combined --output arch/model/export/table
      - echo pass > .step-status/export-table

  - name: export-png
    image: ghcr.io/paulefl/bausteinsicht:latest
    depends_on: [export-plantuml, export-mermaid, export-table]
    commands:
      - mkdir -p .step-status
      - mkdir -p arch/model/export/png
      - dbus-daemon --system --fork 2>/dev/null || true
      - xvfb-run -a bausteinsicht export --model arch/model/beaglebone_black.jsonc --output arch/model/export/png
      - echo pass > .step-status/export-png

  - name: commit-exports
    image: alpine/git
    depends_on: [export-png]
    environment:
      GIT_TOKEN: {from_secret: git_token}
      GIT_USER:  {from_secret: git_user}
    commands:
      - mkdir -p .step-status
      - git config user.name "drone-ci[bot]"
      - git config user.email "drone-ci[bot]@noreply"
      - git add arch/model/export/
      - |
        if git diff --staged --quiet; then
          echo "Keine Änderungen in arch/model/export"
        else
          git commit -m "ci(bausteinsicht): update exported diagrams [skip ci]"
          git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} HEAD:${DRONE_BRANCH}
        fi
      - echo pass > .step-status/commit-exports
    when:
      event: [push]
      branch: [main, develop]

  - name: generate-junit
    image: alpine
    depends_on: [validate-model, export-plantuml, export-mermaid, export-table, export-png, commit-exports]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 8-bausteinsicht validate-model export-plantuml export-mermaid export-table export-png commit-exports
    when:
      status: [success, failure]

  - name: allure-generate
