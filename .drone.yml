---
# ════════════════════════════════════════
# PIPELINE 1 — C & Rust Libraries
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 1-libraries

trigger:
  event: [push, pull_request, tag]
  paths:
    - c-lib/**
    - project/rust-lib/**
    - .drone.yml

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: build-libraries
    image: ghcr.io/paulefl/generic-builder:latest
    environment:
      SRC: /drone/src
      OUTPUT: /drone/src/bin
    commands:
      - bash /drone/src/scripts/build-arm.sh

  - name: test-c-lib
    image: debian:bookworm
    depends_on: [build-libraries]
    commands:
      - apt-get update -q && apt-get install -y -q gcc make lcov
      - make -C c-lib CFLAGS="-fprofile-arcs -ftest-coverage -g" CC=gcc test
      - bash scripts/c_coverage.sh c-lib/ reports/c-coverage.info '/usr/*' '*/test/*'
      - lcov --summary reports/c-coverage.info

  - name: test-rust-lib
    image: rust:1.77-alpine
    depends_on: [build-libraries]
    commands:
      - apk add --no-cache musl-dev
      - cargo test --manifest-path project/rust-lib/Cargo.toml
