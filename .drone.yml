---
# ════════════════════════════════════════
# PIPELINE 1 — C & Rust Libraries
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 1-libraries

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom, promote]
  branch:
    exclude: [refs/tags/*]
  paths:
    - project/c-lib/**
    - project/rust-lib/**
    - project/go-api/pkg/hal/**
    - scripts/build-arm.sh
    - docker/builder/**


volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: cargo-registry
    host:
      path: /var/cache/drone/cargo/registry
  - name: cargo-git
    host:
      path: /var/cache/drone/cargo/git
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: build-libraries
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
      - name: cargo-git
        path: /usr/local/cargo/git
    environment:
      SRC: /drone/src
      OUTPUT: /drone/src/bin
      STEP: build-libraries
      CMD: bash scripts/build-arm.sh
    commands:
      - sh scripts/run-step.sh

  - name: test-c-lib-pytest
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    depends_on: [build-libraries]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: test-c-lib-pytest
      CMD: |
        pip install --quiet pytest allure-pytest
        make -C c-lib test-bin
        pytest tests/c_lib/ --alluredir=allure-results -v || true
        make -C c-lib test
    commands:
      - sh scripts/run-step.sh

  - name: test-c-lib-go
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    depends_on: [build-libraries]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: test-c-lib-go
      CMD: |
        make -C c-lib test-bin
        (cd tools/c_test_runner && go mod tidy && go test -v ./... -count=1)
    commands:
      - sh scripts/run-step.sh

  - name: test-c-lib-cgo
    image: golang:1.24
    pull: if_not_exists
    depends_on: [build-libraries]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      CGO_ENABLED: "1"
      STEP: test-c-lib-cgo
      CMD: |
        mkdir -p allure-results
        cd tools/c_cgo_test
        go mod tidy
        ALLURE_OUTPUT_PATH=../../allure-results go test -v ./... -count=1
    commands:
      - sh scripts/run-step.sh

  - name: test-rust-lib
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    depends_on: [build-libraries]
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
      - name: cargo-git
        path: /usr/local/cargo/git
    environment:
      STEP: test-rust-lib
      CMD: cargo test --manifest-path project/rust-lib/Cargo.toml
    commands:
      - sh scripts/run-step.sh

  - name: test-go
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    depends_on: [build-libraries]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      COVERPKG: ./pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/
      TEST_PACKAGES: ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/
      STEP: test-go
      CMD: |
        mkdir -p reports
        cd project/go-api
        mkdir -p ../../reports
        gotestsum \
          --junitfile ../../reports/go-tests-junit.xml \
          --jsonfile  ../../reports/go-tests.json \
          -- \
          -race -count=3 \
          -coverprofile=coverage.out \
          -covermode=atomic \
          -coverpkg=$COVERPKG \
          $TEST_PACKAGES
        total=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
        echo "Coverage: ${total}%"
        awk "BEGIN{exit !($total >= 75)}" || (echo "Coverage gate: ${total}% < 75%" && exit 1)
        echo "Coverage gate: ${total}% >= 75%"
    commands:
      - sh scripts/run-step.sh

  - name: junit-reports-pipe1
    image: ghcr.io/rohit-gohri/drone-junit:v0
    pull: if_not_exists
    depends_on: [build-libraries, test-c-lib-pytest, test-c-lib-go, test-go]
    settings:
      paths: reports/*.xml
      report_name: "Pipe 1 - Build & Tests"
    when:
      status: [success, failure]

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [build-libraries, test-c-lib-pytest, test-c-lib-go, test-c-lib-cgo, test-rust-lib, test-go]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 1-libraries build-libraries test-c-lib-pytest test-c-lib-go test-c-lib-cgo test-rust-lib test-go
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 1-libraries
      - echo "Allure Report http://192.168.2.55/downloads/1-libraries/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=1-libraries
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 2 — Embedded SW (Go API + HAL)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 2-embedded-sw

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom]
  branch:
    exclude: [refs/tags/*]
  paths:
    - project/go-api/**
    - project/c-lib/**
    - project/rust-lib/**
    - scripts/build-arm.sh


volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: cargo-registry
    host:
      path: /var/cache/drone/cargo/registry
  - name: cargo-git
    host:
      path: /var/cache/drone/cargo/git
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: test-hal-unit
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: test-hal-unit
      CMD: "(cd project/go-api && go test ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ -v -count=1)"
    commands:
      - sh scripts/run-step.sh

  - name: lint-go
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: lint-go
      CMD: make lint
    commands:
      - sh scripts/run-step.sh

  - name: build-go-api
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    depends_on: [test-hal-unit]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
      - name: cargo-registry
        path: /usr/local/cargo/registry
      - name: cargo-git
        path: /usr/local/cargo/git
    environment:
      SRC: /drone/src
      OUTPUT: /drone/src/bin
      JUNIT: ""
      STEP: build-go-api
      CMD: bash scripts/build-arm.sh
    commands:
      - sh scripts/run-step.sh

  - name: deploy-beaglebone
    image: appleboy/drone-scp@sha256:fa5bce5d58d4c265e88519bdee0fcd6d5721888c97dd3f3665632b38e7329384
    pull: if_not_exists
    depends_on: [build-go-api]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      source:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-arm
      target: /app/
    when:
      branch: [main, develop]
      event: [push]

  - name: restart-service
    image: appleboy/drone-ssh
    pull: if_not_exists
    depends_on: [deploy-beaglebone]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key
      script:
        - cp /app/bbcli-linux-arm /app/bbcli
        - systemctl restart embedded-sw
        - sleep 3
        - systemctl is-active embedded-sw
    when:
      branch: [main, develop]
      event: [push]

  - name: test-hardware-all-backends
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [restart-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      STEP: test-hardware-all-backends
      CMD: |
        pip install pytest requests --break-system-packages -q
        for backend in c rust auto; do echo "=== Backend $backend ==="; HW_BACKEND=$backend pytest tests/hardware/ -v --timeout=60 || exit 1; done
    commands:
      - sh scripts/run-step.sh
    when:
      branch: [main, develop]
      event: [push]

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [test-hal-unit, lint-go, build-go-api, test-hardware-all-backends]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 2-embedded-sw test-hal-unit lint-go build-go-api test-hardware-all-backends
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 2-embedded-sw
      - echo "Allure Report http://192.168.2.55/downloads/2-embedded-sw/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=2-embedded-sw
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 3 — Tools (CLI + TUI + GUI)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 3-tools

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom, promote]
  branch:
    exclude: [refs/tags/*]
  paths:
    - tools/**

volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: lint-cli
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: lint-cli
      CMD: |
        (cd tools/cli && go mod tidy && go vet ./...)
        test -z "$(gofmt -l tools/cli/)" || (echo "gofmt: tools/cli/" && exit 1)
    commands:
      - sh scripts/run-step.sh

  - name: lint-tui
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: lint-tui
      CMD: "(cd tools/tui && go mod tidy && go vet ./...)"
    commands:
      - sh scripts/run-step.sh

  - name: build-cli-linux-amd64
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-cli]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
      STEP: build-cli-linux-amd64
      CMD: "(cd tools/cli && go build -ldflags=\"-s -w\" -o ../../bin/bbcli-linux-amd64 .)"
    commands:
      - sh scripts/run-step.sh

  - name: build-cli-linux-arm
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-cli]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
      CGO_ENABLED: "0"
      STEP: build-cli-linux-arm
      CMD: "(cd tools/cli && go build -ldflags=\"-s -w\" -o ../../bin/bbcli-linux-arm .)"
    commands:
      - sh scripts/run-step.sh

  - name: build-cli-darwin-amd64
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-cli]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: "0"
      STEP: build-cli-darwin-amd64
      CMD: "(cd tools/cli && go build -ldflags=\"-s -w\" -o ../../bin/bbcli-darwin-amd64 .)"
    commands:
      - sh scripts/run-step.sh

  - name: build-cli-darwin-arm64
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-cli]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      GOOS: darwin
      GOARCH: arm64
      CGO_ENABLED: "0"
      STEP: build-cli-darwin-arm64
      CMD: "(cd tools/cli && go build -ldflags=\"-s -w\" -o ../../bin/bbcli-darwin-arm64 .)"
    commands:
      - sh scripts/run-step.sh

  - name: build-cli-windows-amd64
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-cli]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
      STEP: build-cli-windows-amd64
      CMD: "(cd tools/cli && go build -ldflags=\"-s -w\" -o ../../bin/bbcli-windows-amd64.exe .)"
    commands:
      - sh scripts/run-step.sh

  - name: build-tui-linux-amd64
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-tui]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
      STEP: build-tui-linux-amd64
      CMD: "(cd tools/tui && go build -ldflags=\"-s -w\" -o ../../bin/bbtui-linux-amd64 .)"
    commands:
      - sh scripts/run-step.sh

  - name: build-tui-linux-armv7
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-tui]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
      CGO_ENABLED: "0"
      STEP: build-tui-linux-armv7
      CMD: "(cd tools/tui && go build -ldflags=\"-s -w\" -o ../../bin/bbtui-linux-armv7 .)"
    commands:
      - sh scripts/run-step.sh

  - name: build-tui-darwin-amd64
    image: golang:1.24
    pull: if_not_exists
    depends_on: [lint-tui]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: "0"
      STEP: build-tui-darwin-amd64
      CMD: "(cd tools/tui && go build -ldflags=\"-s -w\" -o ../../bin/bbtui-darwin-amd64 .)"
    commands:
      - sh scripts/run-step.sh

  - name: validate-web-gui
    image: python:3.12-alpine
    pull: if_not_exists
    environment:
      STEP: validate-web-gui
      CMD: |
        python -c "
        from html.parser import HTMLParser
        class V(HTMLParser): pass
        V().feed(open('tools/web-gui/index.html').read())
        print('HTML valide')
        "
    commands:
      - sh scripts/run-step.sh

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    pull: if_not_exists
    environment:
      STEP: shellcheck
      CMD: shellcheck --severity=error scripts/*.sh
    commands:
      - sh scripts/run-step.sh

  - name: checksums
    image: alpine
    pull: if_not_exists
    depends_on:
      - build-cli-linux-amd64
      - build-cli-linux-arm
      - build-cli-darwin-amd64
      - build-cli-darwin-arm64
      - build-cli-windows-amd64
      - build-tui-linux-amd64
      - build-tui-linux-armv7
      - build-tui-darwin-amd64
    environment:
      STEP: checksums
      CMD: "(cd bin && sha256sum bbcli-* bbtui-* > checksums.sha256 && cat checksums.sha256)"
    commands:
      - sh scripts/run-step.sh

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [lint-cli, lint-tui, build-cli-linux-amd64, build-cli-linux-arm, build-cli-darwin-amd64, build-cli-darwin-arm64, build-cli-windows-amd64, build-tui-linux-amd64, build-tui-linux-armv7, build-tui-darwin-amd64, validate-web-gui, shellcheck, checksums]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 3-tools lint-cli lint-tui build-cli-linux-amd64 build-cli-linux-arm build-cli-darwin-amd64 build-cli-darwin-arm64 build-cli-windows-amd64 build-tui-linux-amd64 build-tui-linux-armv7 build-tui-darwin-amd64 validate-web-gui shellcheck checksums
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 3-tools
      - echo "Allure Report http://192.168.2.55/downloads/3-tools/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=3-tools
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 4 — WebApp Frontend
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 4-webapp

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom]
  branch:
    exclude: [refs/tags/*]
  paths:
    - tools/web-gui/**

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: validate-html
    image: python:3.12-alpine
    pull: if_not_exists
    environment:
      STEP: validate-html
      CMD: |
        python -c "
        from html.parser import HTMLParser
        class V(HTMLParser): pass
        V().feed(open('tools/web-gui/index.html').read())
        print('HTML valide')
        "
    commands:
      - sh scripts/run-step.sh

  - name: package-web-gui
    image: alpine
    pull: if_not_exists
    depends_on: [validate-html]
    environment:
      STEP: package-web-gui
      CMD: |
        apk add --no-cache zip
        mkdir -p bin/web-gui
        cp tools/web-gui/index.html bin/web-gui/
        echo "${DRONE_TAG:-dev}" > bin/web-gui/version.txt
        (cd bin && zip -r bbweb-gui.zip web-gui/)
    commands:
      - sh scripts/run-step.sh

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [validate-html, package-web-gui]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 4-webapp validate-html package-web-gui
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 4-webapp
      - echo "Allure Report http://192.168.2.55/downloads/4-webapp/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=4-webapp
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 5 — Release (nur bei Tags)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 5-release

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [tag]
  ref:
    exclude: [refs/tags/*-toTestOnTarget, refs/tags/*-stable]


volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: cargo-registry
    host:
      path: /var/cache/drone/cargo/registry
  - name: cargo-git
    host:
      path: /var/cache/drone/cargo/git
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: build-arm
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
      - name: cargo-git
        path: /usr/local/cargo/git
    environment:
      SRC: /drone/src
      OUTPUT: /drone/src/bin
      JUNIT: ""
      STEP: build-arm
      CMD: bash scripts/build-arm.sh
    commands:
      - sh scripts/run-step.sh

  - name: build-cli
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: build-cli
      CMD: |
        mkdir -p bin
        cd tools/cli
        GOOS=linux  GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-linux-amd64 .
        GOOS=linux  GOARCH=arm GOARM=7  CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-linux-arm .
        GOOS=darwin GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-amd64 .
        GOOS=darwin GOARCH=arm64        CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-arm64 .
        GOOS=windows GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbcli-windows-amd64.exe .
    commands:
      - sh scripts/run-step.sh

  - name: build-tui
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: build-tui
      CMD: |
        mkdir -p bin
        cd tools/tui
        GOOS=linux  GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-linux-amd64 .
        GOOS=linux  GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-linux-armv7 .
        GOOS=darwin GOARCH=amd64       CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../bin/bbtui-darwin-amd64 .
    commands:
      - sh scripts/run-step.sh

  - name: build-web-gui
    image: alpine
    pull: if_not_exists
    environment:
      STEP: build-web-gui
      CMD: |
        apk add --no-cache zip
        mkdir -p bin/web-gui
        cp tools/web-gui/index.html bin/web-gui/
        echo "$DRONE_TAG" > bin/web-gui/version.txt
        (cd bin && zip -r bbweb-gui.zip web-gui/)
    commands:
      - sh scripts/run-step.sh

  - name: checksums
    image: alpine
    pull: if_not_exists
    depends_on: [build-arm, build-cli, build-tui, build-web-gui]
    environment:
      STEP: checksums
      CMD: "(cd bin && sha256sum embedded bbcli-* bbtui-* bbweb-gui.zip > checksums.sha256 && cat checksums.sha256)"
    commands:
      - sh scripts/run-step.sh

  - name: build-docker-image
    image: quay.io/podman/stable
    pull: if_not_exists
    privileged: true
    depends_on: [build-arm]
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: Bau_token}
      STEP: build-docker-image
      CMD: |
        podman login ghcr.io -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN"
        podman build --platform linux/arm/v7 -f project/go-api/Dockerfile.embedded -t ghcr.io/$REGISTRY_USER/embedded-sw:$DRONE_TAG -t ghcr.io/$REGISTRY_USER/embedded-sw:latest .
        podman push ghcr.io/$REGISTRY_USER/embedded-sw:$DRONE_TAG
        podman push ghcr.io/$REGISTRY_USER/embedded-sw:latest
    commands:
      - sh scripts/run-step.sh

  - name: create-release
    image: plugins/github-release
    pull: if_not_exists
    depends_on: [build-docker-image, checksums]
    settings:
      api_key: {from_secret: github_token}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbcli-darwin-amd64
        - bin/bbcli-darwin-arm64
        - bin/bbcli-windows-amd64.exe
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/bbtui-darwin-amd64
        - bin/bbweb-gui.zip
        - bin/checksums.sha256
      checksum: [sha256]
      title: "Release $DRONE_TAG"

  - name: create-toTestOnTarget-release
    image: plugins/github-release
    pull: if_not_exists
    depends_on: [create-release]
    settings:
      api_key: {from_secret: github_token}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/checksums.sha256
      checksum: [sha256]
      title: "$DRONE_TAG-toTestOnTarget"
      tag: "$DRONE_TAG-toTestOnTarget"
      prerelease: true

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [build-arm, build-cli, build-tui, build-web-gui, checksums, build-docker-image]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 5-release build-arm build-cli build-tui build-web-gui checksums build-docker-image
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 5-release
      - echo "Allure Report http://192.168.2.55/downloads/5-release/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=5-release
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 6 — Nightly (täglich 02:00)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 6-nightly

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [cron]
  cron: [nightly]

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: test-all-backends
    image: python:3.12-alpine
    pull: if_not_exists
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      STEP: test-all-backends
      CMD: |
        pip install pytest requests --break-system-packages -q
        for backend in c rust auto; do echo "=== Backend $backend ==="; HW_BACKEND=$backend pytest tests/hardware/ -v --timeout=60 || exit 1; done
    commands:
      - sh scripts/run-step.sh

  - name: notify-slack
    image: plugins/slack
    pull: if_not_exists
    depends_on: [test-all-backends]
    settings:
      webhook: {from_secret: slack_webhook}
      channel: builds
      template: "Nightly Build {{build.number}} — {{build.status}} {{build.link}}"
    when:
      status: [success, failure]

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [test-all-backends]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 6-nightly test-all-backends
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 6-nightly
      - echo "Allure Report http://192.168.2.55/downloads/6-nightly/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=6-nightly
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 7 — Reports & Quality Gates
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 7-reports

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom]
  branch:
    exclude: [refs/tags/*]
  paths:
    - project/**
    - tests/**
    - scripts/**
    - docs/**

volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: pip-cache
    host:
      path: /var/cache/drone/pip
  - name: gem-cache
    host:
      path: /var/cache/drone/gem
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: go-tests-with-coverage
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: go-tests-with-coverage
      CMD: |
        mkdir -p reports
        cd project/go-api
        go install gotest.tools/gotestsum@v1.12.0
        gotestsum \
          --junitfile ../../reports/go-tests-junit.xml \
          --jsonfile  ../../reports/go_tests.json \
          -- \
          -count=1 \
          -coverprofile=../../reports/go_coverage.out \
          -covermode=atomic \
          -coverpkg=./pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/ \
          ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ || true
        go tool cover -func=../../reports/go_coverage.out || true
    commands:
      - sh scripts/run-step.sh

  - name: junit-reports-pipe-7
    image: ghcr.io/rohit-gohri/drone-junit:v0
    pull: if_not_exists
    depends_on: [go-tests-with-coverage]
    settings:
      paths: reports/go-tests-junit.xml
      report_name: "junit-reports - Pipe 7 - go-tests-with-coverage"
    when:
      status: [success, failure]

  - name: python-tests
    image: python:3.12-alpine
    pull: if_not_exists
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: python-tests
      CMD: |
        mkdir -p reports
        pip install -r tests/requirements-dev.txt pytest-json-report --break-system-packages -q
        pytest tests/ --ignore=tests/hardware/ -v --json-report --json-report-file=reports/python_tests.json --timeout=30 || true
    commands:
      - sh scripts/run-step.sh

  - name: python-security
    image: python:3.12-alpine
    pull: if_not_exists
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: python-security
      CMD: |
        mkdir -p reports
        pip install bandit bandit-sarif-formatter --break-system-packages -q
        bandit -r scripts/ tests/ project/ -f sarif -o reports/python-sarif.json --exclude tests/hardware/ || true
        echo "Bandit done"
    commands:
      - sh scripts/run-step.sh

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    pull: if_not_exists
    environment:
      STEP: shellcheck
      CMD: |
        mkdir -p reports
        shellcheck scripts/*.sh 2>&1 | tee reports/shellcheck.txt || true
    commands:
      - sh scripts/run-step.sh

  - name: c-coverage
    image: debian:bookworm
    pull: if_not_exists
    environment:
      STEP: c-coverage
      CMD: |
        mkdir -p reports
        apt-get update -q && apt-get install -y -q gcc make lcov
        make -C c-lib CFLAGS="-fprofile-arcs -ftest-coverage -g" CC=gcc test || true
        bash scripts/c_coverage.sh c-lib/ reports/c-coverage.info '/usr/*' '*/test/*' || true
    commands:
      - sh scripts/run-step.sh

  - name: adoc-build
    image: asciidoctor/docker-asciidoctor:latest
    pull: if_not_exists
    volumes:
      - name: gem-cache
        path: /usr/local/bundle
    environment:
      STEP: adoc-build
      CMD: |
        gem install asciidoctor-pdf rouge --quiet || true
        ROOT_DIR=. OUTPUT_DIR=reports/docs bash scripts/build_adoc.sh || true
        find reports/docs -name "*.html" -o -name "*.pdf" | sort || true
    commands:
      - sh scripts/run-step.sh

  - name: strictdoc-export
    image: python:3.12-slim
    pull: if_not_exists
    depends_on: [go-tests-with-coverage]
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: strictdoc-export
      CMD: |
        apt-get update -qq
        apt-get install -y -q zip
        pip install strictdoc
        mkdir -p reports/strictdoc
        strictdoc export . --formats html --output-dir reports/strictdoc || true
        find reports/strictdoc -name "*.html" | head -10 || true
        zip -r strictdoc-output.zip reports/strictdoc/
    commands:
      - sh scripts/run-step.sh

  - name: prepare-reports
    image: alpine
    pull: if_not_exists
    depends_on: [strictdoc-export]
    environment:
      STEP: prepare-reports
      CMD: |
        SHA8=$(echo "$DRONE_COMMIT_SHA" | head -c8)
        FILE=strictdoc-$SHA8.zip
        mv strictdoc-output.zip $FILE
        echo $FILE > artifact_name.txt
    commands:
      - sh scripts/run-step.sh

  - name: upload
    image: alpine
    pull: if_not_exists
    depends_on: [prepare-reports]
    environment:
      STEP: upload
      CMD: |
        apk add --no-cache openssh-client -q
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        FILE=$(cat artifact_name.txt 2>/dev/null || echo "")
        if [ -z "$FILE" ]; then echo "Kein Artefakt-Name — übersprungen"; exit 0; fi
        scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          -i ~/.ssh/id_rsa "$FILE" deploy@192.168.2.55:/var/www/downloads/ || \
          echo "⚠️  Upload fehlgeschlagen (Server nicht erreichbar) — Build wird fortgesetzt"
      SSH_KEY:
        from_secret: ssh_key
    commands:
      - sh scripts/run-step.sh

  - name: print-url
    image: alpine
    pull: if_not_exists
    depends_on: [upload]
    environment:
      STEP: print-url
      CMD: |
        SHA8=$(echo "$DRONE_COMMIT_SHA" | head -c8)
        echo "Download URL:"
        echo "http://192.168.2.55/downloads/strictdoc-$SHA8.zip"
    commands:
      - sh scripts/run-step.sh

  - name: strictdoc-coverage-gate
    image: python:3.12-slim
    pull: if_not_exists
    depends_on: [strictdoc-export]
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: strictdoc-coverage-gate
      CMD: |
        python3 scripts/check_req_coverage.py \
          --sdoc-dir docs/requirements \
          --junit-xml reports/go-tests-junit.xml \
          --output-junit reports/req-coverage-junit.xml \
          --min-coverage 70 || true
    commands:
      - sh scripts/run-step.sh

  - name: traceability-check
    image: python:3.12-slim
    pull: if_not_exists
    depends_on: [strictdoc-coverage-gate]
    environment:
      STEP: traceability-check
      CMD: |
        python3 scripts/gen_traceability_matrix.py \
          --output reports/traceability_matrix.md || true
        python3 scripts/gen_traceability_matrix.py --check || true
    commands:
      - sh scripts/run-step.sh

  - name: junit-reports-req-coverage
    image: ghcr.io/rohit-gohri/drone-junit:v0
    pull: if_not_exists
    depends_on: [strictdoc-coverage-gate]
    settings:
      paths: reports/req-coverage-junit.xml
      report_name: "junit-reports - Req coverage"
    when:
      status: [success, failure]

  - name: sonarqube-report
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [go-tests-with-coverage, c-coverage, python-security]
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: sonarqube-report
      CMD: |
        pip install requests defusedxml --break-system-packages -q
        SONAR_TOKEN=$(cat /run/secrets/sonar_token 2>/dev/null || echo "")
        if [ -z "$SONAR_TOKEN" ]; then echo "SONAR_TOKEN nicht gesetzt — übersprungen"; exit 0; fi
        python3 .github/actions/sonarqube-report/sonarqube_report.py --token "$SONAR_TOKEN" --project paulefl_beaglebone_black --output reports/sonar-report.html || true
    commands:
      - sh scripts/run-step.sh

  - name: sonarcloud-scan
    image: sonarsource/sonar-scanner-cli:latest
    pull: if_not_exists
    depends_on: [go-tests-with-coverage, c-coverage, python-security]
    environment:
      STEP: sonarcloud-scan
      CMD: |
        sonar-scanner \
            -Dsonar.projectKey=paulefl_beaglebone_black \
            -Dsonar.organization=paulefl \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.go.coverage.reportPaths=reports/go_coverage.out \
            -Dsonar.c.lcov.reportPaths=reports/c-coverage.info \
            || true
    commands:
      - sh scripts/run-step.sh
    when:
      branch: [main, develop]
      event: [push]

  - name: collect-and-report
    image: python:3.12-slim
    pull: if_not_exists
    depends_on:
      - go-tests-with-coverage
      - python-tests
      - c-coverage
      - adoc-build
    environment:
      STEP: collect-and-report
      CMD: |
        pip install reportlab jinja2 --quiet
        python3 scripts/collect_results.py --workspace reports --output reports/test_results.json || true
        python3 scripts/generate_reports.py --output reports/summary --results reports/test_results.json --trend reports/test_trend.json || true
        ls -lh reports/ || true
    commands:
      - sh scripts/run-step.sh

  - name: quality-gates
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [collect-and-report]
    environment:
      STEP: quality-gates
      CMD: "python3 scripts/collect_results.py --check-gates --results reports/test_results.json --min-success-rate 90 --min-avg-coverage 75 --min-file-coverage 50 || true"
    commands:
      - sh scripts/run-step.sh

  - name: package-artifacts
    image: alpine
    pull: if_not_exists
    depends_on:
      - collect-and-report
      - adoc-build
      - strictdoc-coverage-gate
      - traceability-check
      - sonarqube-report
    environment:
      STEP: package-artifacts
      CMD: |
        apk add --no-cache zip
        (cd reports && zip -r ../reports-$DRONE_BUILD_NUMBER.zip . 2>/dev/null || true)
        echo "Artifacts gepackt"
    commands:
      - sh scripts/run-step.sh

  - name: notify
    image: plugins/slack
    pull: if_not_exists
    depends_on: [quality-gates, package-artifacts]
    settings:
      webhook: {from_secret: slack_webhook}
      channel: builds
      template: "Build {{build.number}} — {{build.status}} {{build.link}}"
    when:
      status: [success, failure]
      branch: [main, develop]
      event:  [push, tag]

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [go-tests-with-coverage, python-tests, python-security, shellcheck, c-coverage, adoc-build, strictdoc-export, prepare-reports, print-url, strictdoc-coverage-gate, traceability-check, sonarqube-report, sonarcloud-scan, collect-and-report, quality-gates, package-artifacts]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 7-reports go-tests-with-coverage python-tests python-security shellcheck c-coverage adoc-build strictdoc-export prepare-reports print-url strictdoc-coverage-gate traceability-check sonarqube-report sonarcloud-scan collect-and-report quality-gates package-artifacts
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 7-reports
      - echo "Allure Report http://192.168.2.55/downloads/7-reports/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=7-reports
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 8 — Bausteinsicht
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 8-bausteinsicht

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom]
  branch:
    exclude: [refs/tags/*]
  paths:
    - arch/model/**

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: validate-model
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: if_not_exists
    environment:
      STEP: validate-model
      CMD: bausteinsicht validate --model arch/model/beaglebone_black.jsonc
    commands:
      - sh scripts/run-step.sh

  - name: export-plantuml
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: if_not_exists
    depends_on: [validate-model]
    environment:
      STEP: export-plantuml
      CMD: |
        mkdir -p arch/model/export/plantuml
        bausteinsicht export-diagram --model arch/model/beaglebone_black.jsonc --diagram-format plantuml --output arch/model/export/plantuml
    commands:
      - sh scripts/run-step.sh

  - name: export-mermaid
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: if_not_exists
    depends_on: [validate-model]
    environment:
      STEP: export-mermaid
      CMD: |
        mkdir -p arch/model/export/mermaid
        bausteinsicht export-diagram --model arch/model/beaglebone_black.jsonc --diagram-format mermaid --output arch/model/export/mermaid
    commands:
      - sh scripts/run-step.sh

  - name: export-table
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: if_not_exists
    depends_on: [validate-model]
    environment:
      STEP: export-table
      CMD: |
        mkdir -p arch/model/export/table
        bausteinsicht export-table --model arch/model/beaglebone_black.jsonc --table-format md --combined --output arch/model/export/table
    commands:
      - sh scripts/run-step.sh

  - name: export-png
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: if_not_exists
    depends_on: [export-plantuml, export-mermaid, export-table]
    environment:
      STEP: export-png
      CMD: |
        mkdir -p arch/model/export/png
        dbus-daemon --system --fork 2>/dev/null || true
        xvfb-run -a bausteinsicht export --model arch/model/beaglebone_black.jsonc --output arch/model/export/png || true
    commands:
      - sh scripts/run-step.sh

  - name: commit-exports
    image: alpine/git
    pull: if_not_exists
    depends_on: [export-png]
    environment:
      GIT_TOKEN: {from_secret: git_token}
      GIT_USER:  {from_secret: git_user}
      STEP: commit-exports
      CMD: |
        git config user.name "drone-ci[bot]"
        git config user.email "drone-ci[bot]@noreply"
        git add arch/model/export/
        if git diff --staged --quiet; then
          echo "Keine Änderungen in arch/model/export"
        else
          git commit -m "ci(bausteinsicht): update exported diagrams [skip ci]"
          git push https://${GIT_USER}:${GIT_TOKEN}@${DRONE_GIT_HTTP_URL#https://} HEAD:${DRONE_BRANCH}
        fi
    commands:
      - sh scripts/run-step.sh
    when:
      event: [push]
      branch: [main, develop]

  - name: generate-junit
    image: alpine
    pull: if_not_exists
    depends_on: [validate-model, export-plantuml, export-mermaid, export-table, export-png, commit-exports]
    commands:
      - apk add --no-cache bash
      - sh scripts/generate-junit.sh 8-bausteinsicht validate-model export-plantuml export-mermaid export-table export-png commit-exports
    when:
      status: [success, failure]

  - name: allure-generate
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [generate-junit]
    commands:
      - bash scripts/allure-generate.sh 8-bausteinsicht
      - echo "Allure Report http://192.168.2.55/downloads/8-bausteinsicht/allure-report/index.html"
    when:
      status: [success, failure]

  - name: publish-allure
    image: alpine
    pull: if_not_exists
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    depends_on: [allure-generate]
    commands:
      - apk add --no-cache make unzip -q
      - make publish-allure PIPELINE=8-bausteinsicht
    when:
      status: [success, failure]

