# ════════════════════════════════════════
# PIPELINE 14 — Runner Cleanup
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 14-cleanup

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [cron]
  cron: [cleanup]

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

steps:
  - name: prune-images
    image: docker:cli
    pull: if_not_exists
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - echo "=== Docker disk usage before ==="
      - docker system df
      - echo "=== Removing unused images (>48h) ==="
      - docker image prune -af --filter "until=48h"
      - echo "=== Removing stopped containers ==="
      - docker container prune -f
      - echo "=== Removing unused volumes ==="
      - docker volume prune -f
      - echo "=== Removing unused networks ==="
      - docker network prune -f
      - echo "=== Docker disk usage after ==="
      - docker system df
