  branch:
    exclude: [refs/tags/*]
  paths:
    include:
      - project/**
      - tests/**
      - docs/requirements/**
      - Makefile
      - .drone.yml

volumes:
  - name: go-mod-cache
    host:
      path: /var/cache/drone/go/pkg/mod
  - name: go-build-cache
    host:
      path: /var/cache/drone/go/build
  - name: pip-cache
    host:
      path: /var/cache/drone/pip
  - name: cargo-registry
    host:
      path: /var/cache/drone/cargo/registry
  - name: cargo-git
    host:
      path: /var/cache/drone/cargo/git
  - name: build-cache
    host:
      path: /var/cache/drone/build-artifacts
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: restore-artifacts
    image: alpine
    pull: if_not_exists
    volumes:
      - name: build-cache
        path: /build-cache
    commands:
      - mkdir -p bin project/go-api/libs
      - cp -r /build-cache/$DRONE_BUILD_NUMBER/bin/. bin/ 2>/dev/null || true
      - cp /build-cache/$DRONE_BUILD_NUMBER/go-api-libs/*.so project/go-api/libs/ 2>/dev/null || true

  - name: test-c-lib-pytest
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    depends_on: [restore-artifacts]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: test-c-lib-pytest
      CMD: |
        pip install --quiet pytest allure-pytest
        make -C c-lib test-bin
        pytest tests/c_lib/ --alluredir=allure-results -v || true
        make -C c-lib test
    commands:
      - sh scripts/run-step.sh

  - name: test-c-lib-go
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    depends_on: [restore-artifacts]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: test-c-lib-go
      CMD: |
        make -C c-lib test-bin
        (cd tools/c_test_runner && go mod tidy && go test -v ./... -count=1)
    commands:
      - sh scripts/run-step.sh

  - name: test-c-lib-cgo
    image: golang:1.24
    pull: if_not_exists
    depends_on: [restore-artifacts]
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      CGO_ENABLED: "1"
      STEP: test-c-lib-cgo
      CMD: |
        mkdir -p allure-results
        cd tools/c_cgo_test
        go mod tidy
        ALLURE_OUTPUT_PATH=../../allure-results go test -v ./... -count=1
    commands:
      - sh scripts/run-step.sh

  - name: test-rust-lib
    image: ghcr.io/paulefl/generic-builder:latest
    pull: if_not_exists
    depends_on: [restore-artifacts]
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
      - name: cargo-git
        path: /usr/local/cargo/git
    environment:
      STEP: test-rust-lib
      CMD: cargo test --manifest-path project/rust-lib/Cargo.toml
    commands:
      - sh scripts/run-step.sh

  - name: go-tests-with-coverage
    image: golang:1.24
    pull: if_not_exists
    volumes:
      - name: go-mod-cache
        path: /go/pkg/mod
      - name: go-build-cache
        path: /root/.cache/go-build
    environment:
      STEP: go-tests-with-coverage
      CMD: |
        mkdir -p reports
        cd project/go-api
        go install gotest.tools/gotestsum@v1.12.0
        gotestsum \
          --junitfile ../../reports/go-tests-junit.xml \
          --jsonfile  ../../reports/go_tests.json \
          -- \
          -count=1 \
          -coverprofile=../../reports/go_coverage.out \
          -covermode=atomic \
          -coverpkg=./pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/ \
          ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ || true
        go tool cover -func=../../reports/go_coverage.out || true
    commands:
      - sh scripts/run-step.sh

  - name: junit-reports-pipe-7a
    image: ghcr.io/rohit-gohri/drone-junit:v0
    pull: if_not_exists
    depends_on: [go-tests-with-coverage]
    settings:
      paths: reports/go-tests-junit.xml
      report_name: "junit-reports - sw-unit-tests - go-tests-with-coverage"
    when:
      status: [success, failure]

  - name: python-tests
    image: python:3.12-alpine
    pull: if_not_exists
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: python-tests
      CMD: |
        mkdir -p reports
        pip install -r tests/requirements-dev.txt pytest-json-report --break-system-packages -q
        pytest tests/ --ignore=tests/hardware/ -v --json-report --json-report-file=reports/python_tests.json --timeout=30 || true
    commands:
      - sh scripts/run-step.sh

  - name: c-coverage
    image: debian:bookworm
    pull: if_not_exists
    environment:
      STEP: c-coverage
      CMD: |
        mkdir -p reports
        apt-get update -q && apt-get install -y -q gcc make lcov
        make -C c-lib CFLAGS="-fprofile-arcs -ftest-coverage -g" CC=gcc test || true
        bash scripts/c_coverage.sh c-lib/ reports/c-coverage.info '/usr/*' '*/test/*' || true
    commands:
      - sh scripts/run-step.sh

  - name: sonarqube-report
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [go-tests-with-coverage, c-coverage]
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: sonarqube-report
      CMD: |
        pip install requests defusedxml --break-system-packages -q
        SONAR_TOKEN=$(cat /run/secrets/sonar_token 2>/dev/null || echo "")
        if [ -z "$SONAR_TOKEN" ]; then echo "SONAR_TOKEN nicht gesetzt — übersprungen"; exit 0; fi
        python3 .github/actions/sonarqube-report/sonarqube_report.py --token "$SONAR_TOKEN" --project paulefl_beaglebone_black --output reports/sonar-report.html || true
    commands:
      - sh scripts/run-step.sh

  - name: sonarcloud-scan
    image: sonarsource/sonar-scanner-cli:latest
    pull: if_not_exists
    depends_on: [go-tests-with-coverage, c-coverage]
    environment:
      STEP: sonarcloud-scan
      CMD: |
        sonar-scanner \
            -Dsonar.projectKey=paulefl_beaglebone_black \
            -Dsonar.organization=paulefl \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.go.coverage.reportPaths=reports/go_coverage.out \
            -Dsonar.c.lcov.reportPaths=reports/c-coverage.info \
            || true
    commands:
      - sh scripts/run-step.sh
    when:
      branch: [main, develop]
      event: [push]

  - name: strictdoc-coverage-gate
    image: python:3.12-slim
    pull: if_not_exists
    depends_on: [go-tests-with-coverage]
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: strictdoc-coverage-gate
      CMD: |
        python3 scripts/check_req_coverage.py \
          --sdoc-dir docs/requirements \
          --junit-xml reports/go-tests-junit.xml \
          --output-junit reports/req-coverage-junit.xml \
          --min-coverage 70 || true
        [ -f reports/req-coverage-junit.xml ] || echo '<?xml version="1.0"?><testsuites/>' > reports/req-coverage-junit.xml
    commands:
      - sh scripts/run-step.sh

  - name: traceability-check
    image: python:3.12-slim
    pull: if_not_exists
    depends_on: [strictdoc-coverage-gate]
    environment:
      STEP: traceability-check
      CMD: |
        python3 scripts/gen_traceability_matrix.py \
          --output reports/traceability_matrix.md || true
        python3 scripts/gen_traceability_matrix.py --check || true
    commands:
      - sh scripts/run-step.sh

  - name: junit-reports-req-coverage
    image: ghcr.io/rohit-gohri/drone-junit:v0
    pull: if_not_exists
    depends_on: [strictdoc-coverage-gate]
    settings:
      paths: reports/req-coverage-junit.xml
      report_name: "junit-reports - Req coverage"
    when:
      status: [success, failure]

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [test-c-lib-pytest, test-c-lib-go, test-c-lib-cgo, test-rust-lib, go-tests-with-coverage, python-tests, c-coverage, sonarqube-report, sonarcloud-scan, strictdoc-coverage-gate, traceability-check]
    commands:
      - sh scripts/save-pipeline-results.sh sw-unit-tests
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 7b — Static Analysis
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 7b-analysis

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom]
  branch:
    exclude: [refs/tags/*]
  paths:
    include:
      - project/**
      - tests/**
      - scripts/**
      - .drone.yml

volumes:
  - name: pip-cache
    host:
      path: /var/cache/drone/pip
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: python-security
    image: python:3.12-alpine
    pull: if_not_exists
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: python-security
      CMD: |
        mkdir -p reports
        pip install bandit bandit-sarif-formatter --break-system-packages -q
        bandit -r scripts/ tests/ project/ -f sarif -o reports/python-sarif.json --exclude tests/hardware/ || true
        echo "Bandit done"
    commands:
      - sh scripts/run-step.sh

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    pull: if_not_exists
    environment:
      STEP: shellcheck
      CMD: sh scripts/shellcheck-report.sh
    commands:
      - sh scripts/run-step.sh

  - name: publish-shellcheck
    image: alpine
    pull: if_not_exists
    depends_on: [shellcheck]
    volumes:
      - name: www-downloads
        path: /var/www/downloads
    commands:
      - DEST=/var/www/downloads/shellcheck
      - mkdir -p "$DEST"
      - cp reports/shellcheck.txt "$DEST/shellcheck-${DRONE_BUILD_NUMBER}.txt"
      - cp reports/shellcheck-junit.xml "$DEST/shellcheck-${DRONE_BUILD_NUMBER}-junit.xml"
      - echo "Reports verfügbar unter /downloads/shellcheck/shellcheck-${DRONE_BUILD_NUMBER}.*"

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [python-security, shellcheck, publish-shellcheck]
    commands:
      - sh scripts/save-pipeline-results.sh 7b-analysis
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 7c — Documentation
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 7c-docs

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom]
  branch:
    exclude: [refs/tags/*]
  paths:
    include:
      - docs/**
      - scripts/**
      - project/**
      - .drone.yml
    exclude:
      - scripts/build-container.sh

volumes:
  - name: pip-cache
    host:
      path: /var/cache/drone/pip
  - name: gem-cache
    host:
      path: /var/cache/drone/gem
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: adoc-build
    image: asciidoctor/docker-asciidoctor:latest
    pull: if_not_exists
    volumes:
      - name: gem-cache
        path: /usr/local/bundle
    environment:
      STEP: adoc-build
      CMD: |
        gem install asciidoctor-pdf rouge --quiet || true
        ROOT_DIR=. OUTPUT_DIR=reports/docs bash scripts/build_adoc.sh || true
        find reports/docs -name "*.html" -o -name "*.pdf" | sort || true
    commands:
      - sh scripts/run-step.sh

  - name: strictdoc-export
    image: python:3.12-slim
    pull: if_not_exists
    volumes:
      - name: pip-cache
        path: /root/.cache/pip
    environment:
      STEP: strictdoc-export
      CMD: |
        apt-get update -qq
        apt-get install -y -q zip
        pip install strictdoc
        mkdir -p reports/strictdoc
        strictdoc export . --formats html --output-dir reports/strictdoc || true
        find reports/strictdoc -name "*.html" | head -10 || true
        (cd reports/strictdoc && zip -r ../../strictdoc-output.zip .)
    commands:
      - sh scripts/run-step.sh

  - name: publish-strictdoc
    image: alpine
    pull: if_not_exists
    depends_on: [adoc-build, strictdoc-export]
    volumes:
      - name: www-downloads
        path: /var/www/downloads
      - name: pipeline-results
        path: /pipeline-results
    environment:
      DEPLOY_HOST:
        from_secret: deploy_host
    commands:
      - apk add --no-cache unzip -q
      - mkdir -p /var/www/downloads/7c-docs/strictdoc
      - unzip -o strictdoc-output.zip -d /var/www/downloads/7c-docs/strictdoc/
      - echo "StrictDoc verfuegbar unter http://$DEPLOY_HOST/downloads/7c-docs/strictdoc/"
      - sh scripts/save-pipeline-results.sh 7c-docs
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 8 — Bausteinsicht
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 8-bausteinsicht

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom]
  branch:
    exclude: [refs/tags/*]
  paths:
    include:
      - arch/model/**
      - .drone.yml

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: show-version
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: always
    commands:
      - 'echo "bausteinsicht container version: $APP_VERSION"'

  - name: validate-model
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: always
    depends_on: [show-version]
    environment:
      STEP: validate-model
      CMD: bausteinsicht validate --model arch/model/beaglebone_black.jsonc
    commands:
      - sh scripts/run-step.sh

  - name: export-plantuml
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: always
    depends_on: [validate-model]
    environment:
      STEP: export-plantuml
      CMD: |
        mkdir -p arch/model/export/plantuml
        bausteinsicht export-diagram --model arch/model/beaglebone_black.jsonc --diagram-format plantuml --output arch/model/export/plantuml
    commands:
      - sh scripts/run-step.sh

  - name: export-mermaid
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: always
    depends_on: [validate-model]
    environment:
      STEP: export-mermaid
      CMD: |
        mkdir -p arch/model/export/mermaid
        bausteinsicht export-diagram --model arch/model/beaglebone_black.jsonc --diagram-format mermaid --output arch/model/export/mermaid
    commands:
      - sh scripts/run-step.sh

  - name: export-table
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: always
    depends_on: [validate-model]
    environment:
      STEP: export-table
      CMD: |
        mkdir -p arch/model/export/table
        bausteinsicht export-table --model arch/model/beaglebone_black.jsonc --table-format md --combined --output arch/model/export/table
    commands:
      - sh scripts/run-step.sh

  - name: export-png
    image: ghcr.io/paulefl/bausteinsicht:latest
    pull: always
    depends_on: [export-plantuml, export-mermaid, export-table]
    environment:
      STEP: export-png
      CMD: |
        mkdir -p arch/model/export/png
        dbus-daemon --system --fork 2>/dev/null || true
        xvfb-run -a bausteinsicht export --model arch/model/beaglebone_black.jsonc --output arch/model/export/png || true
    commands:
      - sh scripts/run-step.sh

  - name: commit-exports
    image: alpine/git
    pull: if_not_exists
    depends_on: [export-png]
    commands:
      - sh scripts/ci-git-setup.sh
      - git add arch/model/export/
      - 'git diff --staged --quiet && echo "Keine Änderungen in arch/model/export" || git commit -m "ci(bausteinsicht): update exported diagrams [skip ci]"'
    when:
      event: [push]
      branch: [main, develop]

  - name: push-exports
    image: plugins/git-action
    pull: if_not_exists
    depends_on: [commit-exports]
    environment:
      PLUGIN_NETRC_PASSWORD:
        from_secret: git_token
    settings:
      actions:
        - push
      remote: https://github.com/paulefl/beaglebone_black.git
      branch: ${DRONE_BRANCH}
      netrc_machine: github.com
      netrc_username: paulefl
    when:
      event: [push]
      branch: [main, develop]

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [show-version, validate-model, export-plantuml, export-mermaid, export-table, export-png, push-exports]
    commands:
      - sh scripts/save-pipeline-results.sh 8-bausteinsicht
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 10 — Integration Tests (on-target)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 10-integration-tests

image_pull_secrets:
  - dockerconfigjson

depends_on: [2-embedded-sw]

trigger:
  event: [push, pull_request, custom, tag]
  branch:
    exclude: [refs/tags/*]

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: download-release-assets
    image: alpine
    pull: if_not_exists
    environment:
      GIT_TOKEN: {from_secret: git_token}
      STEP: download-release-assets
      CMD: |
        apk add --no-cache curl jq
        mkdir -p bin
        TAG=$DRONE_TAG
        curl -sL -H "Authorization: token $GIT_TOKEN" \
          "https://api.github.com/repos/$DRONE_REPO/releases/tags/$TAG" \
          | jq -r '.assets[] | .browser_download_url' \
          | while read url; do
              NAME=$(basename "$url")
              curl -sL -H "Authorization: token $GIT_TOKEN" -o "bin/$NAME" "$url"
              echo "Downloaded: $NAME"
            done
        ls -lh bin/
    commands:
      - sh scripts/run-step.sh
    when:
      event: [tag]
      ref:
        include: [refs/tags/*-toTestOnTarget]

  - name: deploy-to-bbb
    image: appleboy/drone-scp@sha256:fa5bce5d58d4c265e88519bdee0fcd6d5721888c97dd3f3665632b38e7329384
    pull: if_not_exists
    depends_on: [download-release-assets]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key_bbb
      source:
        - bin/embedded
        - bin/libhardware.so
        - bin/libhardware_rs.so
        - bin/bbcli-linux-arm
      target: /home/debian/bin/
    when:
      event: [tag]
      ref:
        include: [refs/tags/*-toTestOnTarget]

  - name: restart-bbb-service
    image: appleboy/drone-ssh
    pull: if_not_exists
    depends_on: [deploy-to-bbb]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key_bbb
      script:
        - cp ~/bin/bbcli-linux-arm ~/bin/bbcli
        - chmod +x ~/bin/*
        - echo "Deploy abgeschlossen"
    when:
      event: [tag]
      ref:
        include: [refs/tags/*-toTestOnTarget]

  - name: test-hardware-all-backends
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [download-release-assets, restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      BBCLI_REMOTE: /home/debian/bin/bbcli
      STEP: test-hardware-all-backends
      CMD: |
        apk add --no-cache openssh-client curl -q
        pip install pytest pytest-timeout requests pytest-json-report --break-system-packages -q
        echo "=== API Diagnose ===" && curl -s http://$BEAGLE_HOST:5000/health || true
        for backend in c rust auto; do
          echo "=== Backend $backend ==="
          curl -sf -X POST http://$BEAGLE_HOST:5000/api/v1/backend -H 'Content-Type: application/json' -d "{\"backend\":\"$backend\"}" || true
          HW_BACKEND=$backend pytest tests/hardware/test_hardware.py -v --timeout=60 --json-report --json-report-file=reports/hardware-${backend}-tests.json || exit 1
        done
    commands:
      - sh scripts/run-step.sh

  - name: test-api
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      STEP: test-api
      CMD: |
        pip install pytest pytest-timeout requests pytest-json-report --break-system-packages -q
        pytest tests/api/test_api.py -v --timeout=30 --json-report --json-report-file=reports/api-tests.json || true
    commands:
      - sh scripts/run-step.sh

  - name: test-uart-on-bbb
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      BEAGLE_USER:
        from_secret: beagle_user
      BBCLI_REMOTE: /home/debian/bin/bbcli
      STEP: test-uart-on-bbb
      CMD: |
        apk add --no-cache openssh-client -q
        pip install pytest pytest-timeout requests --break-system-packages -q
        pytest tests/hardware/test_uart.py -v --timeout=30 -k 'not Loopback' --json-report --json-report-file=reports/uart-tests.json || true
    commands:
      - sh scripts/run-step.sh
    when:
      event: [tag]
      ref:
        include: [refs/tags/*-toTestOnTarget]

  - name: test-cli-on-bbb
    image: appleboy/drone-ssh
    pull: if_not_exists
    depends_on: [restart-bbb-service]
    settings:
      host:
        from_secret: beagle_host
      username:
        from_secret: beagle_user
      key:
        from_secret: ssh_key_bbb
      script:
        - ~/bin/bbcli --version
        - ~/bin/bbcli system status
        - ~/bin/bbcli bme280 read
        - echo "CLI on-device Tests bestanden"
    when:
      event: [tag]
      ref:
        include: [refs/tags/*-toTestOnTarget]

  - name: test-cli-remote
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [restart-bbb-service]
    environment:
      BEAGLE_HOST:
        from_secret: beagle_host
      BBCLI: ./bin/bbcli-linux-amd64
      STEP: test-cli-remote
      CMD: |
        pip install pytest pytest-json-report --break-system-packages -q
        chmod +x bin/bbcli-linux-amd64
        pytest tests/cli/test_cli.py -v --timeout=30 --json-report --json-report-file=reports/cli-tests.json || true
    commands:
      - sh scripts/run-step.sh
    when:
      event: [tag]
      ref:
        include: [refs/tags/*-toTestOnTarget]

  - name: promote-to-stable
    image: alpine
    pull: if_not_exists
    depends_on:
      - test-hardware-all-backends
      - test-api
      - test-uart-on-bbb
      - test-cli-on-bbb
      - test-cli-remote
    environment:
      GIT_TOKEN: {from_secret: git_token}
      STEP: promote-to-stable
      CMD: |
        apk add --no-cache curl jq git
        OLD_TAG=$DRONE_TAG
        VERSION=${OLD_TAG%-toTestOnTarget}
        NEW_TAG=$VERSION-stable
        echo "Promoting $OLD_TAG -> $NEW_TAG"
        curl -sf -X POST "https://api.github.com/repos/$DRONE_REPO/releases" \
          -H "Authorization: token $GIT_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"${NEW_TAG}\",\"name\":\"${VERSION}\",\"prerelease\":false}"
        echo "Promoted zu $NEW_TAG"
    commands:
      - sh scripts/run-step.sh
    when:
      event: [tag]
      ref:
        include: [refs/tags/*-toTestOnTarget]

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [test-hardware-all-backends, test-api, test-uart-on-bbb, test-cli-remote, promote-to-stable]
    commands:
      - sh scripts/save-pipeline-results.sh 10-integration-tests
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 11 — Version Bump & Release
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 11-version-bump

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [promote]
  target: [release-patch, release-minor, release-major]

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: bump-version
    image: alpine/git
    pull: if_not_exists
    environment:
      GIT_TOKEN: {from_secret: git_token}
      STEP: bump-version
      CMD: |
        BUMP=${DRONE_DEPLOY_TO##release-}
        CURRENT=$(grep '^VERSION' Makefile | awk '{print $3}')
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        case "$BUMP" in
          major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR+1)); PATCH=0 ;;
          patch) PATCH=$((PATCH+1)) ;;
        esac
        NEW="${MAJOR}.${MINOR}.${PATCH}"
        sed -i "s/^VERSION = .*/VERSION = $NEW/" Makefile
        sh scripts/ci-git-setup.sh
        git add Makefile CHANGELOG.md
        git commit -m "chore(release): bump version to ${NEW} [skip ci]"
        git tag "v${NEW}"
        git push https://paulefl:${GIT_TOKEN}@github.com/paulefl/beaglebone_black.git HEAD:main
        git push https://paulefl:${GIT_TOKEN}@github.com/paulefl/beaglebone_black.git "v${NEW}"
    commands:
      - sh scripts/run-step.sh

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [bump-version]
    commands:
      - sh scripts/save-pipeline-results.sh 11-version-bump
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 12 — Changelog Update
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 12-changelog

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [push, pull_request, custom]
  branch: [main]
  paths:
    include:
      - project/**
      - tools/**
      - Makefile
      - .drone.yml

volumes:
  - name: www-downloads
    host:
      path: /var/www/downloads
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results

steps:
  - name: update-changelog
    image: alpine/git
    pull: if_not_exists
    environment:
      STEP: update-changelog
      CMD: sh scripts/update-changelog.sh
    commands:
      - sh scripts/run-step.sh

  - name: push-changelog
    image: plugins/git-action
    pull: if_not_exists
    depends_on: [update-changelog]
    environment:
      PLUGIN_NETRC_PASSWORD:
        from_secret: git_token
    settings:
      actions:
        - push
      remote: https://github.com/paulefl/beaglebone_black.git
      branch: main
      netrc_machine: github.com
      netrc_username: paulefl
    when:
      event: [push]
      branch: [main]

  - name: save-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    depends_on: [push-changelog]
    commands:
      - sh scripts/save-pipeline-results.sh 12-changelog
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 15 — Centralized Reporting
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 15-reporting

image_pull_secrets:
  - dockerconfigjson

depends_on:
  - 1-libraries
  - 2-embedded-sw
  - apps-build-test
  - 5-release
  - 6-nightly
  - sw-unit-tests
  - 7b-analysis
  - 7c-docs
  - 8-bausteinsicht
  - 9-build-container
  - 10-integration-tests
  - 11-version-bump
  - 12-changelog

trigger:
  event: [push, pull_request, custom, tag, promote, cron]

volumes:
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results
  - name: www-downloads
    host:
      path: /var/www/downloads

steps:
  - name: report-all
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
      - name: www-downloads
        path: /var/www/downloads
    environment:
      DEPLOY_HOST:
        from_secret: deploy_host
    commands:
      - apt-get update -q && apt-get install -y --no-install-recommends make -q
      - make report-all
    when:
      status: [success, failure]

  - name: collect-and-report
    image: python:3.12-slim
    pull: if_not_exists
    depends_on: [report-all]
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    commands:
      - cp -r /pipeline-results/$DRONE_BUILD_NUMBER/7-reports/reports reports 2>/dev/null || true
      - pip install reportlab jinja2 --quiet
      - python3 scripts/collect_results.py --workspace reports --output reports/test_results.json || true
      - python3 scripts/generate_reports.py --output reports/summary --results reports/test_results.json --trend reports/test_trend.json || true
      - ls -lh reports/ || true
    when:
      status: [success, failure]

  - name: quality-gates
    image: python:3.12-alpine
    pull: if_not_exists
    depends_on: [collect-and-report]
    commands:
      - python3 scripts/collect_results.py --check-gates --results reports/test_results.json --min-success-rate 90 --min-avg-coverage 75 --min-file-coverage 50 || true
    when:
      status: [success, failure]

  - name: package-artifacts
    image: alpine
    pull: if_not_exists
    depends_on: [collect-and-report]
    commands:
      - apk add --no-cache zip
      - (cd reports && zip -r ../reports-$DRONE_BUILD_NUMBER.zip . 2>/dev/null || true)
      - echo "Artifacts gepackt"
    when:
      status: [success, failure]

  - name: generate-dashboard
    image: eclipse-temurin:17-jre
    pull: if_not_exists
    depends_on: [report-all]
    commands:
      - bash scripts/allure-dashboard.sh
    when:
      status: [success, failure]

  - name: upload-dashboard
    image: appleboy/drone-scp@sha256:fa5bce5d58d4c265e88519bdee0fcd6d5721888c97dd3f3665632b38e7329384
    pull: if_not_exists
    depends_on: [generate-dashboard]
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: ssh_key
      source: allure-dashboard.zip
      target: /var/www/downloads/dashboard/
      mkdir: true
    when:
      status: [success, failure]

  - name: unzip-dashboard
    image: appleboy/drone-ssh
    pull: if_not_exists
    depends_on: [upload-dashboard]
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: ssh_key
      script:
        - cd /var/www/downloads/dashboard && unzip -o allure-dashboard.zip
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 14 — Runner Cleanup
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 14-cleanup

image_pull_secrets:
  - dockerconfigjson

trigger:
  event: [cron]
  cron: [cleanup]

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock
  - name: pipeline-results
    host:
      path: /var/cache/drone/pipeline-results
  - name: build-cache
    host:
      path: /var/cache/drone/build-artifacts

steps:
  - name: prune-images
    image: docker:cli
    pull: if_not_exists
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - echo "=== Docker disk usage before ==="
      - docker system df
      - echo "=== Removing unused images (>48h) ==="
      - docker image prune -af --filter "until=48h"
      - echo "=== Removing stopped containers ==="
      - docker container prune -f
      - echo "=== Removing unused volumes ==="
      - docker volume prune -f
      - echo "=== Removing unused networks ==="
      - docker network prune -f
      - echo "=== Docker disk usage after ==="
      - docker system df

  - name: prune-pipeline-results
    image: alpine
    pull: if_not_exists
    volumes:
      - name: pipeline-results
        path: /pipeline-results
    commands:
      - echo "=== Removing pipeline-results older than 7 days ==="
      - find /pipeline-results -maxdepth 1 -mindepth 1 -type d -mtime +7 -exec rm -rf {} +
      - echo "=== Remaining builds ==="
      - ls /pipeline-results/

  - name: prune-build-artifacts
    image: alpine
    pull: if_not_exists
    volumes:
      - name: build-cache
        path: /build-cache
    commands:
      - echo "=== Removing build-artifacts older than 1 day ==="
      - find /build-cache -maxdepth 1 -mindepth 1 -type d -mtime +1 -exec rm -rf {} +
      - echo "=== Remaining builds ==="
      - ls /build-cache/
