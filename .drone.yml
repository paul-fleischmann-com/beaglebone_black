---
# ════════════════════════════════════════
# PIPELINE 1 — C & Rust Libraries
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 1-libraries

trigger:
  event: [push, pull_request, tag]
  paths:
    - c-lib/**
    - project/rust-lib/**
    - .drone.yml

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: build-libraries
    image: ghcr.io/paulefl/generic-builder:latest
    commands:
      - SRC=/drone/src OUTPUT=/drone/src/bin bash /drone/src/scripts/build-arm.sh

  - name: test-c-lib
    image: debian:bookworm
    depends_on: [build-libraries]
    commands:
      - echo "testing rust lib"

  - name: test-rust-lib
    image: rust:1.77-alpine
    depends_on: [build-libraries]
    commands:
      - echo "testing rust lib"

  - name: test-go
    image: ghcr.io/paulefl/generic-builder:latest
    depends_on: [build-libraries]
    environment:
      COVERPKG: ./pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/
      TEST_PACKAGES: ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/
    commands:
      - cd project/go-api
      - go install gotest.tools/gotestsum@v1.12.0
      - go install github.com/boumenot/gocover-cobertura@latest
      - mkdir -p ../../reports
      - >-
        gotestsum
        --junitfile ../../reports/go-tests-junit.xml
        --jsonfile  ../../reports/go-tests.json
        --
        -race -count=3
        -coverprofile=coverage.out
        -covermode=atomic
        -coverpkg=$COVERPKG
        $TEST_PACKAGES
      - |
        total=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
        echo "Coverage: ${total}%"
        awk "BEGIN{exit !($total >= 75)}" || (echo "❌ Coverage gate: ${total}% < 75%" && exit 1)
        echo "✅ Coverage gate: ${total}% >= 75%"

---
# ════════════════════════════════════════
# PIPELINE 2 — Embedded SW (Go API + HAL)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 2-embedded-sw

trigger:
  event: [push, pull_request, tag]
  paths:
    - project/go-api/**
    - c-lib/**
    - project/rust-lib/**
    - .drone.yml

image_pull_secrets:
  - dockerconfigjson

steps:
  - name: test-hal-unit
    image: golang:1.24
    commands:
      - cd project/go-api && go test ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ -v -count=1

  - name: lint-go
    image: golang:1.24
    depends_on: []
    commands:
      - make lint

  - name: build-go-api
    image: ghcr.io/paulefl/generic-builder:latest
    depends_on: [test-hal-unit]
    commands:
      - SRC=/drone/src OUTPUT=/drone/src/bin bash /drone/src/scripts/build-arm.sh

  - name: deploy-beaglebone
    image: alpine
    depends_on: [build-go-api]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      BEAGLE_USER: {from_secret: beagle_user}
      BEAGLE_KEY:  {from_secret: beagle_ssh_key}
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$BEAGLE_KEY" | base64 -d > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -H $BEAGLE_HOST >> ~/.ssh/known_hosts
      - scp bin/embedded project/go-api/libs/libhardware.so project/go-api/libs/libhardware_rs.so bin/bbcli-linux-arm $BEAGLE_USER@$BEAGLE_HOST:/app/
      - |
        ssh $BEAGLE_USER@$BEAGLE_HOST \
            "cp /app/bbcli-linux-arm /app/bbcli && \
             systemctl restart embedded-sw && \
             sleep 3 && \
             systemctl is-active embedded-sw"
    when:
      branch: [main]
      event:  [push]

  - name: test-hardware-c
    image: python:3.12-alpine
    depends_on: [deploy-beaglebone]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      HW_BACKEND: c
    commands:
      - pip install pytest requests --break-system-packages -q
      - pytest tests/hardware/ -v --timeout=60
    when:
      branch: [main]
      event:  [push]

  - name: test-hardware-rust
    image: python:3.12-alpine
    depends_on: [deploy-beaglebone]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
      HW_BACKEND: rust
    commands:
      - pip install pytest requests --break-system-packages -q
      - pytest tests/hardware/ -v --timeout=60
    when:
      branch: [main]
      event:  [push]

  - name: test-hardware-auto
    image: python:3.12-alpine
    depends_on: [test-hardware-c, test-hardware-rust]
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
    commands:
      - pip install pytest requests --break-system-packages -q
      - pytest tests/hardware/ -v --timeout=60
    when:
      branch: [main]
      event:  [push]

---
# ════════════════════════════════════════
# PIPELINE 3 — Tools (CLI + TUI + GUI) 
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 3-tools

trigger:
  event: [push, pull_request, tag]
  paths:
    - tools/**
    - .drone.yml

steps:
  - name: lint-cli
    image: golang:1.24
    commands:
      - cd tools/cli && go mod tidy && go vet ./...
      - |
        test -z "$(gofmt -l tools/cli/)" || (echo "gofmt: tools/cli/" && exit 1)

  - name: lint-tui
    image: golang:1.24
    depends_on: []
    commands:
      - cd tools/tui && go mod tidy && go vet ./...

  - name: build-cli-linux-amd64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-linux-amd64 .

  - name: build-cli-linux-arm
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-linux-arm .

  - name: build-cli-darwin-amd64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-amd64 .

  - name: build-cli-darwin-arm64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: darwin
      GOARCH: arm64
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-darwin-arm64 .

  - name: build-cli-windows-amd64
    image: golang:1.24
    depends_on: [lint-cli]
    environment:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/cli && go build -ldflags="-s -w" -o ../../bin/bbcli-windows-amd64.exe .

  - name: build-tui-linux-amd64
    image: golang:1.24
    depends_on: [lint-tui]
    environment:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/tui && go build -ldflags="-s -w" -o ../../bin/bbtui-linux-amd64 .

  - name: build-tui-linux-armv7
    image: golang:1.24
    depends_on: [lint-tui]
    environment:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
      CGO_ENABLED: "0"
    commands:
      - cd tools/tui && go build -ldflags="-s -w" -o ../../bin/bbtui-linux-armv7 .

  - name: build-tui-darwin-amd64
    image: golang:1.24
    depends_on: [lint-tui]
    environment:
      GOOS: darwin
      GOARCH: amd64
      CGO_ENABLED: "0"
    commands:
      - cd tools/tui && go build -ldflags="-s -w" -o ../../bin/bbtui-darwin-amd64 .

  - name: validate-web-gui
    image: python:3.12-alpine
    depends_on: []
    commands:
      - |
        python -c "
        from html.parser import HTMLParser
        class V(HTMLParser): pass
        V().feed(open('tools/web-gui/index.html').read())
        print('HTML valide')
        "

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    depends_on: []
    commands:
      - shellcheck --severity=error scripts/*.sh

  - name: checksums
    image: alpine
    depends_on:
      - build-cli-linux-amd64
      - build-cli-linux-arm
      - build-cli-darwin-amd64
      - build-cli-darwin-arm64
      - build-cli-windows-amd64
      - build-tui-linux-amd64
      - build-tui-linux-armv7
      - build-tui-darwin-amd64
    commands:
      - cd bin && sha256sum bbcli-* bbtui-* > checksums.sha256 && cat checksums.sha256

---
# ════════════════════════════════════════
# PIPELINE 4 — WebApp Frontend
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 4-webapp

trigger:
  event: [push, pull_request, tag]
  paths:
    - tools/web-gui/**
    - .drone.yml

steps:
  - name: validate-html
    image: python:3.12-alpine
    commands:
      - |
        python -c "
        from html.parser import HTMLParser
        class V(HTMLParser): pass
        V().feed(open('tools/web-gui/index.html').read())
        print('HTML valide')
        "

  - name: package-web-gui
    image: alpine
    depends_on: [validate-html]
    commands:
      - apk add --no-cache zip
      - mkdir -p bin/web-gui
      - cp tools/web-gui/index.html bin/web-gui/
      - echo "${DRONE_TAG:-dev}" > bin/web-gui/version.txt
      - cd bin && zip -r bbweb-gui.zip web-gui/

---
# ════════════════════════════════════════
# PIPELINE 5 — Release (nur bei Tags)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 5-release

trigger:
  event: [tag]
  ref:
    exclude: [refs/tags/*-toTestOnTarget, refs/tags/*-stable]

steps:
  - name: build-docker-image
    image: quay.io/podman/stable
    privileged: true
    environment:
      REGISTRY_USER:  {from_secret: registry_user}
      REGISTRY_TOKEN: {from_secret: registry_token}
    commands:
      - podman login -u $REGISTRY_USER -p $REGISTRY_TOKEN docker.io
      - podman build --platform linux/arm/v7 -f project/go-api/Dockerfile.embedded -t myuser/embedded-sw:${DRONE_TAG} -t myuser/embedded-sw:latest .
      - podman push myuser/embedded-sw:${DRONE_TAG}
      - podman push myuser/embedded-sw:latest

  - name: create-release
    image: plugins/gitea-release
    depends_on: [build-docker-image]
    settings:
      api_key:  {from_secret: gitea_token}
      base_url: {from_secret: gitea_url}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbcli-darwin-amd64
        - bin/bbcli-darwin-arm64
        - bin/bbcli-windows-amd64.exe
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/bbtui-darwin-amd64
        - bin/bbweb-gui.zip
        - bin/checksums.sha256
      checksum: [sha256]
      title: "Release ${DRONE_TAG}"

  - name: create-toTestOnTarget-release
    image: plugins/gitea-release
    depends_on: [create-release]
    settings:
      api_key:  {from_secret: gitea_token}
      base_url: {from_secret: gitea_url}
      files:
        - bin/embedded
        - project/go-api/libs/libhardware.so
        - project/go-api/libs/libhardware_rs.so
        - bin/bbcli-linux-amd64
        - bin/bbcli-linux-arm
        - bin/bbtui-linux-amd64
        - bin/bbtui-linux-armv7
        - bin/checksums.sha256
      checksum: [sha256]
      title: "${DRONE_TAG}-toTestOnTarget"
      tag: "${DRONE_TAG}-toTestOnTarget"
      prerelease: true

---
# ════════════════════════════════════════
# PIPELINE 6 — Nightly (täglich 02:00)
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 6-nightly

trigger:
  event: [cron]
  cron: [nightly]

steps:
  - name: test-all-backends
    image: python:3.12-alpine
    environment:
      BEAGLE_HOST: {from_secret: beagle_host}
    commands:
      - pip install pytest requests --break-system-packages -q
      - for backend in c rust auto; do echo "=== Backend $backend ==="; HW_BACKEND=$backend pytest tests/hardware/ -v --timeout=60 || exit 1; done

  - name: notify-slack
    image: plugins/slack
    depends_on: [test-all-backends]
    settings:
      webhook: {from_secret: slack_webhook}
      channel: builds
      template: "Nightly Build {{build.number}} — {{build.status}} {{build.link}}"
    when:
      status: [success, failure]

---
# ════════════════════════════════════════
# PIPELINE 7 — Reports & Dokumentation
# ════════════════════════════════════════
kind: pipeline
type: docker
name: 7-reports

trigger:
  event: [push, pull_request, tag]
  paths:
    - tests/**
    - project/go-api/**
    - tools/**
    - .drone.yml

steps:
  - name: go-tests-with-coverage
    image: golang:1.24
    commands:
      - mkdir -p reports
      - cd project/go-api
      - |
        go test ./pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/ \
            -v -count=1 -json \
            -coverprofile=../../reports/go_coverage.out \
            -covermode=atomic \
            -coverpkg=./pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/ \
            > ../../reports/go_tests.json || true
      - go tool cover -func=../../reports/go_coverage.out

  - name: python-tests
    image: python:3.12-alpine
    depends_on: []
    commands:
      - mkdir -p reports
      - pip install -r tests/requirements-dev.txt pytest-json-report --break-system-packages -q
      - pytest tests/ --ignore=tests/hardware/ -v --json-report --json-report-file=reports/python_tests.json --timeout=30 || true

  - name: python-security
    image: python:3.12-alpine
    depends_on: []
    commands:
      - mkdir -p reports
      - pip install bandit bandit-sarif-formatter --break-system-packages -q
      - bandit -r scripts/ tests/ project/ -f sarif -o reports/python-sarif.json --exclude tests/hardware/ || true
      - echo "Bandit done"

  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    depends_on: []
    commands:
      - mkdir -p reports
      - shellcheck scripts/*.sh 2>&1 | tee reports/shellcheck.txt || true

  - name: c-coverage
    image: debian:bookworm
    depends_on: []
    commands:
      - mkdir -p reports
      - apt-get update -q && apt-get install -y -q gcc make lcov
      - make -C c-lib CFLAGS="-fprofile-arcs -ftest-coverage -g" CC=gcc test || true
      - bash scripts/c_coverage.sh c-lib/ reports/c-coverage.info '/usr/*' '*/test/*' || true

  - name: adoc-build
    image: asciidoctor/docker-asciidoctor:latest
    depends_on: []
    commands:
      - gem install asciidoctor-pdf rouge --quiet || true
      - ROOT_DIR=. OUTPUT_DIR=reports/docs bash scripts/build_adoc.sh || true
      - find reports/docs -name "*.html" -o -name "*.pdf" | sort || true

  - name: strictdoc-export
    image: python:3.12-slim
    depends_on: []
    commands:
      - pip install strictdoc --quiet
      - strictdoc export . --formats html --output-dir reports/strictdoc || true
      - find reports/strictdoc -name "*.html" | head -10 || true

  - name: sonarqube-report
    image: python:3.12-alpine
    depends_on: [go-tests-with-coverage, c-coverage, python-security]
    environment:
      SONAR_TOKEN: {from_secret: sonar_token}
      SONAR_PROJECT_KEY: paulefl_beaglebone_black
    commands:
      - pip install requests defusedxml --break-system-packages -q
      - |
        if [ -z "$SONAR_TOKEN" ]; then
          echo "SONAR_TOKEN nicht gesetzt — SonarQube Report übersprungen"
          exit 0
        fi
      - python3 .github/actions/sonarqube-report/sonarqube_report.py --token "$SONAR_TOKEN" --project "$SONAR_PROJECT_KEY" --output reports/sonar-report.html || true

  - name: sonarcloud-scan
    image: sonarsource/sonar-scanner-cli:latest
    depends_on: [go-tests-with-coverage, c-coverage, python-security]
    environment:
      SONAR_TOKEN: {from_secret: sonar_token}
    commands:
      - |
        if [ -z "$SONAR_TOKEN" ]; then
          echo "SONAR_TOKEN nicht gesetzt — SonarCloud übersprungen"
          exit 0
        fi
      - |
        sonar-scanner \
            -Dsonar.projectKey=paulefl_beaglebone_black \
            -Dsonar.organization=paulefl \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.go.coverage.reportPaths=reports/go_coverage.out \
            -Dsonar.c.lcov.reportPaths=reports/c-coverage.info \
            || true
    when:
      branch: [main]
      event: [push]

  - name: collect-and-report
    image: python:3.12-slim
    depends_on:
      - go-tests-with-coverage
      - python-tests
      - c-coverage
      - adoc-build
    commands:
      - pip install reportlab jinja2 --quiet
      - python3 scripts/collect_results.py --workspace reports --output reports/test_results.json || true
      - python3 scripts/generate_reports.py --output reports/summary --results reports/test_results.json --trend reports/test_trend.json || true
      - ls -lh reports/ || true

  - name: quality-gates
    image: python:3.12-alpine
    depends_on: [collect-and-report]
    commands:
      - python3 scripts/collect_results.py --check-gates --results reports/test_results.json --min-success-rate 90 --min-avg-coverage 75 --min-file-coverage 50 || true

  - name: package-artifacts
    image: alpine
    depends_on:
      - collect-and-report
      - adoc-build
      - strictdoc-export
      - sonarqube-report
    commands:
      - apk add --no-cache zip
      - cd reports && zip -r ../reports-${DRONE_BUILD_NUMBER}.zip . 2>/dev/null || true
      - echo "Artifacts gepackt"

  - name: notify
    image: plugins/slack
    depends_on: [quality-gates, package-artifacts]
    settings:
      webhook: {from_secret: slack_webhook}
      channel: builds
      template: |
        *{{ repo.name }}* Build {{build.number}} {{#success build.status}}OK{{else}}FEHLER{{/success}}
        Branch: `{{build.branch}}` | {{build.link}}
    when:
      status: [success, failure]
      branch: [main]
      event:  [push, tag]
