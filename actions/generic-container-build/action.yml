name: Smart Generic Container Build
description: Build C/Rust/Go and intelligently run tests (container or BBB)

inputs:
  source_dir:
    description: Source code directory (host path)
    required: true
  test_dir:
    description: Test code directory (host path)
    required: true
  output_dir:
    description: Output directory for binaries (host path)
    required: true
  container_image:
    description: Container image to use for building
    required: true
  build_commands:
     description: Multi-line shell commands to build binaries
     required: true
  test_commands:
    description: Multi-line shell commands to run tests
    required: false
    default: ""

  # OPTIONAL: BBB Deployment
  bbb_host:
    required: false
  bbb_user:
    required: false
  bbb_ssh_key:
    required: false

runs:
  using: "composite"
  steps:

    - name: Prepare output dir
      shell: bash
      run: mkdir -p "$OUTPUT_DIR"
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}

    # =========================
    # BUILD
    # =========================
    - name: Build inside container
      shell: bash
      run: |
        set -e
        echo "=== BUILD ==="

        podman run --rm \
          -v "$OUTPUT_DIR:/output" \
          -v "$SOURCE_DIR:/src" \
          "$CONTAINER_IMAGE" \
          -c "${BUILD_COMMANDS}"

      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
        SOURCE_DIR: ${{ inputs.source_dir }}
        CONTAINER_IMAGE: ${{ inputs.container_image }}
        BUILD_COMMANDS: ${{ inputs.build_commands }}

    # =========================
    # DETECT ARCH
    # =========================
    - name: Detect binary architecture
      shell: bash
      run: |
        echo "=== DETECT ARCH ==="
        FILE_INFO=$(file $OUTPUT_DIR/* | head -n1)
        echo "$FILE_INFO"

        if echo "$FILE_INFO" | grep -q "ARM"; then
          echo "ARCH=ARM" >> $GITHUB_ENV
        else
          echo "ARCH=X86" >> $GITHUB_ENV
        fi
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}

    # =========================
    # TEST IN CONTAINER (nur wenn x86)
    # =========================
    - name: Run tests in container (x86 only)
      if: ${{ env.ARCH == 'X86' && inputs.test_commands != '' }}
      shell: bash
      run: |
        echo "=== TEST (Container x86) ==="

        podman run --rm \
          -v "$OUTPUT_DIR:/output" \
          -v "$TEST_DIR:/tests" \
          "$CONTAINER_IMAGE" \
          -c "${TEST_COMMANDS}"

      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
        TEST_DIR: ${{ inputs.test_dir }}
        CONTAINER_IMAGE: ${{ inputs.container_image }}
        TEST_COMMANDS: ${{ inputs.test_commands }}

    # =========================
    # TEST AUF BBB (nur ARM)
    # =========================
    - name: Deploy & Test on BBB
      if: ${{ env.ARCH == 'ARM' && inputs.bbb_host != '' }}
      shell: bash
      run: |
        echo "=== DEPLOY + TEST (BBB) ==="

        mkdir -p ~/.ssh
        printf '%s' "$BBB_SSH_KEY" | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        eval $(ssh-agent -s)
        ssh-add ~/.ssh/id_rsa

        # Deploy binaries + test script
        scp -o StrictHostKeyChecking=no $OUTPUT_DIR/* $BBB_USER@$BBB_HOST:/home/$BBB_USER/bin/
        scp -o StrictHostKeyChecking=no $TEST_DIR/run_tests.py $BBB_USER@$BBB_HOST:/home/$BBB_USER/

        # Execute
        ssh -o StrictHostKeyChecking=no $BBB_USER@$BBB_HOST <<EOF
          rm -rf /home/$BBB_USER/bin/logs
          mkdir -p /home/$BBB_USER/bin/logs
          chmod +x /home/$BBB_USER/bin/*
          GCOV_PREFIX=/home/$BBB_USER/bin/coverage \
          GCOV_PREFIX_STRIP=100 \
          python3 /home/$BBB_USER/run_tests.py \
            --bin-dir /home/$BBB_USER/bin \
            --log-dir /home/$BBB_USER/bin/logs
        EOF

      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
        TEST_DIR: ${{ inputs.test_dir }}
        BBB_HOST: ${{ inputs.bbb_host }}
        BBB_USER: ${{ inputs.bbb_user }}
        BBB_SSH_KEY: ${{ inputs.bbb_ssh_key }}

    # =========================
    # FETCH LOGS FROM BBB
    # =========================
    - name: Fetch Test Logs from BBB
      if: ${{ env.ARCH == 'ARM' && inputs.bbb_host != '' }}
      shell: bash
      run: |
        echo "=== FETCH LOGS ==="
        mkdir -p logs
        scp -o StrictHostKeyChecking=no -r $BBB_USER@$BBB_HOST:/home/$BBB_USER/bin/logs/* ./logs/ || true

        echo "=== FETCH GCDA (C coverage) ==="
        mkdir -p coverage/c
        scp -o StrictHostKeyChecking=no -r $BBB_USER@$BBB_HOST:/home/$BBB_USER/bin/coverage/ ./coverage/c/ || true
        mkdir -p ./coverage/c/coverage
        find . -maxdepth 2 -name "*.gcno" -exec cp {} ./coverage/c/coverage/ \; || true
      env:
        BBB_HOST: ${{ inputs.bbb_host }}
        BBB_USER: ${{ inputs.bbb_user }}

    # =========================
    # C COVERAGE REPORT
    # =========================
    - name: C Coverage Report
      if: ${{ env.ARCH == 'ARM' && inputs.bbb_host != '' }}
      shell: bash
      run: |
        cp ./coverage/c/coverage/*.gcda "$OUTPUT_DIR"/ || true
        podman run --rm \
          -v "$(pwd)/$OUTPUT_DIR":/gcov_data \
          -v "$(pwd)/project/c":/src/c \
          "$CONTAINER_IMAGE" \
          bash -c "lcov --capture \
            --directory /gcov_data \
            --base-directory /src/c/src \
            --output-file /gcov_data/coverage.info && \
            lcov --list /gcov_data/coverage.info"
        cp "$OUTPUT_DIR"/coverage.info ./coverage/c/ || true
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
        CONTAINER_IMAGE: ${{ inputs.container_image }}

    - name: Upload C Coverage
      if: ${{ env.ARCH == 'ARM' && inputs.bbb_host != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: c-coverage
        path: coverage/c/coverage.info
        if-no-files-found: ignore

    # =========================
    # UPLOAD LOGS
    # =========================
    - name: Upload BBB Logs
      if: ${{ env.ARCH == 'ARM' && inputs.bbb_host != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: bbb-test-logs
        path: logs/
        if-no-files-found: ignore

    # =========================
    # FALLBACK
    # =========================
    - name: Skip tests info
      if: ${{ env.ARCH == 'ARM' && inputs.bbb_host == '' }}
      shell: bash
      run: |
        echo "⚠️ ARM binaries detected but no BBB configured → skipping tests"

    # =========================
    # DEBUG OUTPUT
    # =========================
    - name: List artifacts
      shell: bash
      run: |
        echo "=== OUTPUT FILES ==="
        ls -l "$OUTPUT_DIR"
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}