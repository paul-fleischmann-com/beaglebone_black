# mkad-Konfiguration für die BeagleBone-Black-Seite der MACsec-Demo (#260).
# Vollständige Parameter-Doku: siehe mkad.conf.example im MKAdaemon-Repo
# (https://github.com/Technica-Engineering/MKAdaemon).
#
# WICHTIG: cak/ckn müssen exakt mit mkad-viewer.conf (Container-Gegenstelle)
# übereinstimmen — das ist der gemeinsame Pre-Shared-Key (PSK). Die Werte
# unten sind Demo-Platzhalter (identisch zum MKAdaemon-Upstream-Beispiel) —
# für einen echten Einsatz durch einen selbst generierten, geheimen Wert
# ersetzen (z.B. `openssl rand -hex 16` für cak, `openssl rand -hex 2` für ckn).

log_level: info
verbosity: 1
hello_time: 2000
life_time: 6000
sak_retire_time: 3000
transmit_empty_dist_sak: on
transmit_empty_sak_use: on
transmit_null_xpn: on
secy_polling_ms: 500

interfaces:
  - device: "eth0"
    protected_device: "macsec0"
    intf_mode: STATIC
    macsec: CONF_0
    kay: on
    role: AUTO
    priority: 128
    replay_protect: 0
    delay_protect: on
    unauth_allowed: never
    unsecure_allowed: never
    ciphers: GCM_AES_128
    cak: 50 7C C3 BE C3 DA 4C C7 4B 7F 10 12 11 DF 74 6C
    ckn: 12 34
    drv_macsec_mode: software
