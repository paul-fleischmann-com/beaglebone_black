# meta-bbb-sensors: BME280 sensor support layer for the BeagleBone Black
# embedded project (project/c BME280 driver + kernel/DT enablement).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "bbb-sensors"
BBFILE_PATTERN_bbb-sensors = "^${LAYERDIR}/"
BBFILE_PRIORITY_bbb-sensors = "10"

LAYERSERIES_COMPAT_bbb-sensors = "kirkstone"

LAYERDEPENDS_bbb-sensors = "core"
