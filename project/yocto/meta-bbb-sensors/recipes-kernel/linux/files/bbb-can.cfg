# Kernel config fragment: aktiviert das Linux-CAN-Subsystem (SocketCAN), das
# das Open1722-ACF-CAN-Kernel-Modul (acfcan-mod) laut eigenem README als
# Voraussetzung braucht ("modprobe can" vor "insmod acfcan.ko" — sonst fehlen
# beim ersten Laden CAN-Subsystem-Symbole). Symbolnamen verifiziert gegen
# drivers/net/can/Kconfig (torvalds/linux). Siehe Issue #256.
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_DEV=m
