# Kernel config fragment: aktiviert PRU-ICSS remoteproc/rpmsg für die
# PRU1-GPIO-Kommando-Firmware (project/pru/fw/pru1_gpio_ctrl). Symbolnamen
# verifiziert gegen drivers/soc/ti/Kconfig, drivers/remoteproc/Kconfig,
# drivers/rpmsg/Kconfig (torvalds/linux). Siehe Issue #252.
CONFIG_REMOTEPROC=y
CONFIG_TI_PRUSS=m
CONFIG_PRU_REMOTEPROC=m
CONFIG_RPMSG=y
CONFIG_RPMSG_CHAR=m
CONFIG_RPMSG_VIRTIO=m
