[package]
name    = "hardware-rs"
version = "0.1.0"
edition = "2021"
[lib]
name       = "hardware_rs"
crate-type = ["cdylib","staticlib"]

[[bin]]
name = "rust_app"
path = "test/main.rs"
[dependencies]
linux-embedded-hal = "0.4"
bme280             = "0.3"
serialport         = "4"
spidev             = "0.7"
libc               = "0.2"
[build-dependencies]
cbindgen = "0.29"
