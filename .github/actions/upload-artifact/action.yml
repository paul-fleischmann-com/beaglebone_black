name: Upload Artifact (with quota check)
description: >
  Thin wrapper around actions/upload-artifact@v4.
  On failure emits a ::error:: annotation that is immediately visible
  in the workflow run summary and PR checks — making quota-exceeded
  failures easy to spot without clicking into individual job logs.

inputs:
  name:
    description: Artifact name.
    required: true

  path:
    description: File(s) or directory to upload.
    required: true

  if-no-files-found:
    description: Behavior when no files match path ('warn', 'error', 'ignore').
    required: false
    default: 'warn'

  retention-days:
    description: Artifact retention in days (0 = repo default).
    required: false
    default: '7'

  overwrite:
    description: Overwrite an existing artifact with the same name ('true'/'false').
    required: false
    default: 'false'

runs:
  using: composite
  steps:

    - name: Upload
      id: upload
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name:              ${{ inputs.name }}
        path:              ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days:    ${{ inputs.retention-days }}
        overwrite:         ${{ inputs.overwrite }}

    - name: Check upload result
      if: steps.upload.outcome == 'failure'
      shell: bash
      run: |
        # Annotation — erscheint im PR-Check-Bereich und im Job-Tab oben
        echo "::error title=Artifact Upload Failed (${{ inputs.name }})::Upload fehlgeschlagen. Wahrscheinlich Storage-Quota überschritten — siehe unten."

        # Gruppierter Block im Log — kollabierbar, enthält alle Kontext-Infos
        # Hinweis: der Output des upload-Schritts (uses:) ist nicht programmatisch
        # auslesbar. Kontext-Infos kommen aus den Action-Inputs.
        echo "::group::Artifact Upload Fehler — Details"
        echo ""
        echo "  Artifact : ${{ inputs.name }}"
        echo "  Pfad     : ${{ inputs.path }}"
        echo "  Retention: ${{ inputs.retention-days }} Tage"
        echo ""
        echo "  Häufigste Ursache: Storage-Quota überschritten"
        echo "  Lösung:"
        echo "    1. GitHub → Settings → Billing → Actions Storage"
        echo "    2. Oder: gh api repos/{owner}/{repo}/actions/artifacts --paginate \\"
        echo "             --jq '.artifacts[] | [.name, .id] | @tsv'"
        echo "    3. Cleanup-Job in diesem Workflow löscht CI-interne Artifacts automatisch."
        echo ""
        echo "::endgroup::"
        exit 1
