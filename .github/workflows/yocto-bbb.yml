name: Yocto BBB (Kirkstone + meta-ti + BME280)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      YOCTO_DIR: ${{ github.workspace }}/yocto
      DL_DIR: ${{ github.workspace }}/downloads
      SSTATE_DIR: ${{ github.workspace }}/sstate-cache

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect \
            xz-utils debianutils iputils-ping file locales \
            zstd lz4 curl

      # ----------------------------
      # CACHE RESTORE (optional but recommended)
      # ----------------------------
      - name: Restore sstate cache
        uses: actions/cache@v4
        with:
          path: sstate-cache
          key: sstate-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sstate-${{ runner.os }}-

      - name: Restore downloads cache
        uses: actions/cache@v4
        with:
          path: downloads
          key: dl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ runner.os }}-

      # ----------------------------
      # BUILD
      # ----------------------------
      # scripts/build_yocto.sh is the single source of truth for layer list
      # (poky/meta-openembedded/meta-arm/meta-ti + the project's own
      # meta-bbb-sensors BME280 layer) — shared with the Drone CI pipeline
      # `build-yocto-image` (.drone.yml) to avoid two diverging layer lists.
      - name: Build Yocto image (scripts/build_yocto.sh)
        run: bash scripts/build_yocto.sh

      # ----------------------------
      # ARTIFACTS
      # ----------------------------
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: yocto-bbb-image
          path: |
            yocto/build-bbb/tmp/deploy/images/beaglebone-yocto/*.wic*
            yocto/build-bbb/tmp/deploy/images/beaglebone-yocto/*.dtb*
            yocto/build-bbb/tmp/deploy/images/beaglebone-yocto/zImage*
            yocto/build-bbb/tmp/deploy/images/beaglebone-yocto/*.dtbo
