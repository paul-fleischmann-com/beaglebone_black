name: BBB CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── BBB Build, Test & Deploy (self-hosted) ────
  build-deploy:
    name: Build, Test & Deploy to BBB
    runs-on: self-hosted
    permissions:
      checks: write
      contents: read
      statuses: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/build_container
        with:
          image_name: generic-builder
          dockerfile: docker/builder/Dockerfile
          context: docker/builder
      - uses: ./actions/generic-container-build
        with:
          source_dir: ./project
          test_dir: ./project/python_tests
          output_dir: ./bin
          container_image: generic-builder
          bbb_host: ${{ secrets.BBB_HOST }}
          bbb_user: ${{ secrets.BBB_USER }}
          bbb_ssh_key: ${{ secrets.BBB_SSH_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_commands: |
            set -e
            mkdir -p /output
            echo "=== Build C ==="
            echo "=== Build lib ==="
            arm-linux-gnueabihf-gcc -shared -fPIC \
              --coverage \
              -o /output/libhardware.so \
              $(ls /src/c/src/*.c | grep -v main.c) \
              -I /src/c/include -lm
            find / -name "*.gcno" 2>/dev/null -exec cp {} /output/ \; || true

            echo "=== Build executable ==="
            arm-linux-gnueabihf-gcc \
              --coverage \
              -o /output/bme280_main \
              /src/c/test/main.c \
              -I /src/c/include \
              -L /output -lhardware -lm
            find / -name "*.gcno" 2>/dev/null -exec cp {} /output/ \; || true

            echo "=== Build Rust ==="
            PKG_CONFIG_ALLOW_CROSS=1 \
            PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig \
            cargo build \
              --target armv7-unknown-linux-gnueabihf \
              --release \
              --manifest-path /src/rust-lib/Cargo.toml

            cp /src/rust-lib/target/armv7-unknown-linux-gnueabihf/release/libhardware_rs.so /output/
            cp /src/rust-lib/target/armv7-unknown-linux-gnueabihf/release/rust_app /output/

            echo "=== Build Go ==="
            GOOS=linux GOARCH=arm GOARM=7 go build -o /output/go_app /src/go/main.go
          unit_test_commands: |
            echo "=== Run Go Unit Tests ==="
            cd /src/go-api && CGO_ENABLED=0 gotestsum \
              --junitfile /output/go-test-results.xml \
              ./pkg/hal ./pkg/hal/mock ./pkg/hal/config ./pkg/api/...
          test_commands: |
            echo "=== Run Python Tests ==="
            /opt/venv/bin/coverage run --source=/tests /tests/run_tests.py
            /opt/venv/bin/coverage report -m

  # ── Go HAL Unit Tests ─────────────────────────
  test-go:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-test
        with:
          coverpkg: './pkg/hal/,./pkg/hal/mock/,./pkg/hal/config/'
          test-packages: './pkg/hal/ ./pkg/hal/mock/ ./pkg/hal/config/'
          codecov-flags: hal-unit-tests

  # ── C Coverage ───────────────────────────────
  test-c:
    name: C Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/c-test

  # ── Go Lint ──────────────────────────────────
  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-lint

  # ── Web GUI Validierung ───────────────────────
  test-web:
    name: Web GUI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/html-validate

  # ── Shell Script Syntax ───────────────────────
  test-scripts:
    name: Script Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/shellcheck
        with:
          include-tooling: 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Python Tests (API Mock) ───────────────────
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python-test

  # ── CLI Build (Multi-Plattform) ───────────────
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: [test-go, lint-go]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: bbcli-linux-amd64
          - goos: linux
            goarch: arm
            goarm: "7"
            name: bbcli-linux-armv7
          - goos: darwin
            goarch: amd64
            name: bbcli-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: bbcli-darwin-arm64
          - goos: windows
            goarch: amd64
            name: bbcli-windows-amd64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-build
        with:
          working-directory: tools/cli
          output-path:       bin/${{ matrix.name }}
          goos:              ${{ matrix.goos }}
          goarch:            ${{ matrix.goarch }}
          goarm:             ${{ matrix.goarm }}
          ldflags:           '-s -w -X main.Version=${{ github.ref_name }}'
          artifact-name:     ${{ matrix.name }}

  # ── TUI Build ────────────────────────────────
  build-tui:
    name: Build TUI
    runs-on: ubuntu-latest
    needs: [lint-go]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: bbtui-linux-amd64
          - goos: linux
            goarch: arm
            goarm: "7"
            name: bbtui-linux-armv7
          - goos: darwin
            goarch: amd64
            name: bbtui-darwin-amd64
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-build
        with:
          working-directory: tools/tui
          output-path:       bin/${{ matrix.name }}
          goos:              ${{ matrix.goos }}
          goarch:            ${{ matrix.goarch }}
          goarm:             ${{ matrix.goarm }}
          artifact-name:     ${{ matrix.name }}

  # ── StrictDoc Requirements Export ────────────
  strictdoc:
    name: StrictDoc Export & Validation
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/strictdoc

  # ── Python Security Scan (bandit) ────────────
  security-python:
    name: Python Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python-security

  # ── SonarCloud Quality Analysis ───────────────
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [build-deploy, test-go, test-c, test-python, strictdoc, security-python]
    if: always()
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download C coverage from BBB build
        uses: actions/download-artifact@v4
        with:
          name: output_dir
          path: bin/
        continue-on-error: true

      - uses: ./.github/actions/sonarcloud
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          qualitygate-wait: 'false'

      - uses: ./.github/actions/sonarqube-report
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          project-key: paulefl_beaglebone_black

  # ── Test Report + Trend ───────────────────────
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [build-deploy, test-go, lint-go, test-web, test-scripts, test-python, build-cli, strictdoc, sonarcloud]
    if: always()
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Changelog Update ──────────────────────────
  changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate Unreleased section with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --output unreleased.md
        env:
          OUTPUT: unreleased.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Prepend unreleased section to CHANGELOG.md
        run: |
          if [ -s unreleased.md ]; then
            cat unreleased.md CHANGELOG.md > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
            rm unreleased.md
          fi

      - name: Commit updated CHANGELOG.md via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes — nothing to commit."
            exit 0
          fi
          BRANCH="ci/update-changelog-$(echo ${{ github.sha }} | cut -c1-7)"
          git checkout -b "$BRANCH"
          git commit -m "docs(changelog): update unreleased section [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "docs(changelog): update unreleased section [skip ci]" \
            --body "Automated changelog update via git-cliff. Auto-merged by CI." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --delete-branch --admin

  # ── Release ───────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli, build-tui, test-python, test-scripts]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true
      - name: Checksums
        run: |
          cd bin
          find . -maxdepth 1 -type f | sort | xargs sha256sum > checksums.sha256
          cat checksums.sha256
      - name: Version aus Makefile lesen
        id: version
        run: echo "version=$(make version)" >> $GITHUB_OUTPUT
      - name: Changelog-Section für Release extrahieren
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release_notes.md
          cat release_notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/bbcli-*
            bin/bbtui-*
            bin/checksums.sha256
          body_path: release_notes.md
          name: "v${{ steps.version.outputs.version }}"
