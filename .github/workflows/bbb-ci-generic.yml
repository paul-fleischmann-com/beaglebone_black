name: BBB CI/CD (Generic Container Build + Deploy)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: self-hosted
    name: Build, Test & Deploy to BBB
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/build_container
        with:
           image_name: generic-builder
           dockerfile: docker/builder/Dockerfile
           context: docker/builder
      - uses: ./actions/generic-container-build
        with:
          source_dir: ./project
          test_dir : ./project/python_tests
          output_dir: ./bin
          container_image: generic-builder
          bbb_host : ${{ secrets.BBB_HOST }}
          bbb_user: ${{ secrets.BBB_USER }}
          bbb_ssh_key: ${{ secrets.BBB_SSH_KEY }}
          build_commands: |
            set -e
            mkdir -p /output
            echo "=== Build C ==="
            arm-linux-gnueabihf-gcc \
              -o /output/bme260_main \
              /src/c/src/main.c \
              /src/c/src/bme260.c \
              -I /src/c/include -lm

            echo "=== Build Rust ==="
            cargo build \
              --target armv7-unknown-linux-gnueabihf \
              --release \
              --manifest-path /src/rust/Cargo.toml

            cp /src/rust/target/armv7-unknown-linux-gnueabihf/release/rust_app /output/

            echo "=== Build Go ==="
            GOOS=linux GOARCH=arm GOARM=7 go build -o /output/go_app /src/go/main.go
            
          test_commands: |
            echo "=== Run Python Tests (host binaries only) ==="
            /opt/venv/bin/python /tests/run_tests.py

     
