name: Build & Push Builder Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/builder/**'
  workflow_dispatch:
    inputs:
      registry-url:
        description: "Registry URL (e.g. ghcr.io, docker.io)"
        required: false
        default: "ghcr.io"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & Push to Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./actions/build_container
        with:
          image_name:        generic-builder
          dockerfile:        docker/builder/Dockerfile
          context:           docker/builder
          registry-url:      ${{ inputs.registry-url || 'ghcr.io' }}
          registry-username: ${{ github.actor }}
          registry-token:    ${{ secrets.GITHUB_TOKEN }}
          remote-tag:        ghcr.io/${{ github.repository_owner }}/generic-builder:latest
          push:              'true'
