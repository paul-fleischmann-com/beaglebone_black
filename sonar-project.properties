# SonarCloud Project Configuration
# https://sonarcloud.io
#
# Setup:
#   1. Register at https://sonarcloud.io and import this GitHub repo
#   2. Set organization key below (your SonarCloud org, typically your GitHub handle)
#   3. Add SONAR_TOKEN as GitHub Actions secret (Settings → Secrets → Actions)

sonar.projectKey=paulefl_beaglebone_black
sonar.organization=paulefl
sonar.projectName=BeagleBone Black
sonar.projectVersion=1.1.0

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=project/go-api/cmd,project/go-api/pkg,project/c/src,project/c/include,tools,scripts,tooling
sonar.tests=project/go-api/pkg,tests
sonar.test.inclusions=**/*_test.go,tests/**/*.py
sonar.exclusions=**/vendor/**,project/go-api/libs/**,**/testdata/**,bin/**
# Shell scripts, C headers and hardware-dependent C drivers have no CI coverage
# bme280.c requires real I2C hardware — cannot be covered in CI
sonar.coverage.exclusions=scripts/**,tooling/**,project/c/include/**,project/c/src/bme280.c

# ── C/C++ ─────────────────────────────────────────────────────────────────────
# Compilation Database (generiert via bear während coverage-Build)
sonar.cfamily.compile-commands=c-lib/compile_commands.json
# Coverage via gcovr --sonarqube (generiert vom BBB-CI-Run → bin/sonar-coverage.xml)
sonar.coverageReportPaths=bin/sonar-coverage.xml
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# ── Go ────────────────────────────────────────────────────────────────────────
sonar.go.coverage.reportPaths=reports/go-coverage.out
sonar.testExecutionReportPaths=reports/go-tests-sonar.xml

# ── Python ────────────────────────────────────────────────────────────────────
sonar.python.version=3.12
sonar.python.coverage.reportPaths=reports/python-coverage.xml
sonar.python.xunit.reportPath=reports/pytest-junit.xml

# ── SARIF Reports (Static Analysis) ──────────────────────────────────────────
# Nur Reports die tatsächlich von CI-Jobs erzeugt werden.
# rust-lint.sarif, c-lint.sarif, rust-coverage.xml: kein entsprechender CI-Job vorhanden.
sonar.sarifReportPaths=\
  reports/shell-lint.sarif,\
  reports/requirements-coverage.sarif,\
  reports/python-security.sarif,\
  reports/go-lint.sarif,\
  bin/coverage.sarif

# ── Quality Gates ─────────────────────────────────────────────────────────────
# Quality Gate wird via sonarcloud action mit qualitygate.wait=true erzwungen:
# Ein PR kann nicht gemergt werden wenn neue Issues eingeführt werden.
# Konfiguration der Gate-Regeln: SonarCloud UI → Quality Gates
